name: Restore build output
description: Download the single `workspace-build-output` artifact of this run and unpack it over the checkout.

runs:
  using: composite
  steps:
    - name: Download workspace package output
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: workspace-build-output
        path: ${{ runner.temp }}/workspace-build-output
    - name: Unpack workspace package output
      shell: bash
      working-directory: ${{ github.workspace }}
      # -m: each file takes the time it was unpacked. The output was built from this
      # same commit, and must not read as older than the checkout's sources (the
      # bundle budget would call it stale, and an incremental build would redo it).
      run: |
        tar -xzmf "$RUNNER_TEMP/workspace-build-output/workspace-build-output.tgz" -C .
