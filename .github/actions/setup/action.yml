name: Setup Bun + dependencies
description: Install the pinned Bun, restore its install cache, and run `bun install --frozen-lockfile`.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: ./.github/actions/bun
    - name: Restore Bun install cache
      id: bun-cache-restore
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bun install --frozen-lockfile
    - name: Save Bun install cache
      if: always() && steps.bun-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
