name: CI

# Every job but the security audit and the native builds runs
# `bun run validate --job <job>`, so a local `bun run validate` runs the same
# commands in the same order (packages/engine/scripts/validate.ts lists them).
# Here CI adds the host set-up, one build passed to the jobs that read it, the
# dependency audit and secret scan, and the daemon on other platforms on pushes
# to main.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to read-only permissions. Individual jobs elevate as needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Source-only checks: no build.
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Gates
        run: bun run validate --job gates

  # The one build. Every job that reads compiled output restores this artifact.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Build the engine and every product
        run: bun run validate --job build
      # The engine's build state (tsconfig.tsbuildinfo) travels with its output,
      # so the typecheck job's incremental engine step finds it current.
      - name: Archive the build output
        run: |
          tar -czf "$RUNNER_TEMP/workspace-build-output.tgz" \
            packages/engine/*/dist packages/engine/*/tsconfig.tsbuildinfo packages/judgment/dist products/*/dist
      - name: Upload the build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-build-output
          path: ${{ runner.temp }}/workspace-build-output.tgz
          # Only this run's jobs read it.
          retention-days: 7
          if-no-files-found: error

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Restore the build output
        uses: ./.github/actions/restore-build
      - name: Typecheck, API reports, exports and examples
        run: bun run validate --job typecheck

  # The default suite reads source only (every workspace import resolves to
  # source under Bun), so it starts at once beside the build instead of after it.
  proofs:
    name: Proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Run the default test suite
        run: bun run validate --job proofs

  # The test/live files run commands inside real bubblewrap; a skip fails. Ubuntu
  # 22.04 allows unprivileged user namespaces without relaxing host security
  # (24.04's AppArmor default refuses them); never disable AppArmor, change
  # sysctls or run as root to make a failing host look supported.
  # test/live/payments-unbudgeted-path drives a real Chromium: it uses the
  # runner image's own Google Chrome (/usr/bin/google-chrome, one of the
  # product's system browser paths) and fails, naming that, if none is found.
  live-sandbox:
    name: Live sandbox
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install bubblewrap
        uses: ./.github/actions/apt-install
        with:
          packages: bubblewrap
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Run the live sandbox tests
        run: bun run validate --job live-sandbox

  # Counts per scenario against packages/engine/scripts/measure/budgets.json; wall
  # time only as a ratio inside this run.
  measure:
    name: Measure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # find-content-repeat-ripgrep measures content search with the host's rg.
      - name: Install ripgrep
        uses: ./.github/actions/apt-install
        with:
          packages: ripgrep
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Check the speed budgets
        run: bun run validate --job measure

  # The packages as released, then the three Linux programs built and run: the
  # terminal and Agent programs finish a turn, the web UI's journeys pass in
  # Chromium, the daemon runs inside bubblewrap (Ubuntu 22.04, as for the live
  # sandbox). Ends by refusing any change to the checkout. acquire-native.ts
  # admits the daemon artifact this job uploads by this job's name.
  package:
    name: Package and smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Install bubblewrap
        uses: ./.github/actions/apt-install
        with:
          packages: bubblewrap
      - name: Restore the build output
        uses: ./.github/actions/restore-build
      - name: Install Playwright's Chromium and, only if it cannot start, its OS dependencies
        working-directory: products/webui
        run: |
          # The lockfile's Playwright CLI and its exact Chromium revision.
          timeout --signal=KILL 180s node node_modules/@playwright/test/cli.js install chromium
          if timeout --signal=KILL 30s bun scripts/ci-browser-smoke.ts; then
            exit 0
          else
            probe_status=$?
          fi
          # Never retry after a timed-out controller: Chromium owns a detached
          # process group, so hard-kill cleanup belongs to runner teardown.
          if (( probe_status == 124 || probe_status >= 128 )); then
            exit "$probe_status"
          fi
          sudo -n timeout --signal=KILL 180s "$(command -v node)" "$(realpath node_modules/@playwright/test/cli.js)" install-deps chromium
          timeout --signal=KILL 30s bun scripts/ci-browser-smoke.ts
      - name: Package checks, the three programs, and the smoke runs
        run: bun run validate --job package
      # The daemon program verify:binary just ran, recorded for
      # `bun run --cwd products/daemon native:acquire`.
      - name: Record and archive the Linux x64 daemon program
        env:
          DAEMON_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bun products/daemon/scripts/ci-artifact.ts record "$GITHUB_SHA" "$DAEMON_SOURCE_HEAD"
          tar -czf "$RUNNER_TEMP/daemon-native-linux-x64.tgz" \
            products/daemon/native/goodvibes-daemon-linux-x64 \
            products/daemon/native/goodvibes-daemon-linux-x64.bun \
            products/daemon/native/goodvibes-daemon-linux-x64.bun.LICENSE.md \
            products/daemon/native/goodvibes-daemon-linux-x64.bun.json \
            products/daemon/native/lib/sqlite-vec-linux-x64/vec0.so \
            products/daemon/native/ci-artifact.json
      - name: Upload the Linux x64 daemon program
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-native-linux-x64
          path: ${{ runner.temp }}/daemon-native-linux-x64.tgz
          retention-days: 7
          if-no-files-found: error
      - name: Keep the web UI journey report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webui-e2e-report
          path: |
            products/webui/e2e/.artifacts/report
            products/webui/e2e/.artifacts/test-output
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Dependency audit
        run: bun run security:audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The daemon built and run on each other release platform, on pushes to main
  # (and a manual run), not on pull requests. Each target builds and runs in one
  # job, so nothing is passed between runners.
  native:
    name: Native (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            platform: linux
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            platform: darwin
            runner: macos-15-intel
          - target: darwin-arm64
            platform: darwin
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Install bubblewrap
        if: matrix.platform == 'linux'
        uses: ./.github/actions/apt-install
        with:
          packages: bubblewrap
      - name: Restore the build output
        uses: ./.github/actions/restore-build
      - name: Build the daemon for ${{ matrix.target }}
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: bun products/daemon/scripts/build-native-ci.ts "$NATIVE_TARGET"
      - name: Run the daemon inside bubblewrap
        if: matrix.platform == 'linux'
        run: node products/daemon/scripts/verify-binary.mjs --binary native/goodvibes-daemon-linux-arm64
      # verify-native-execution.mjs reads the record of the payload it runs.
      # Then the launchd service: every service command names the gui/<uid>
      # domain, the one the daemon's own restart, stop and update handover
      # address. The job install-service starts must be there, service-status
      # must read the pid launchd reports, a restart must be a new process,
      # and stop and uninstall must leave nothing in that domain (exit 113).
      # The round runs twice: from the runner's own session, then from an SSH
      # login, whose launchd context is the user's background domain (the case
      # where the legacy load/list acted on the wrong domain); both must reach
      # the same job in gui/<uid>.
      - name: Run the daemon (boot, memory round trip, launchd service)
        if: matrix.platform == 'darwin'
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          node products/daemon/scripts/native-execution-artifact.mjs record "$GITHUB_SHA" "$GITHUB_SHA"
          node products/daemon/scripts/verify-native-execution.mjs "$GITHUB_SHA" "$GITHUB_SHA"
          # The program the build wrote for this target (toolchain.config.json's
          # appArtifact): goodvibes-daemon-macos-<arch>, the name the release ships.
          daemon="$PWD/products/daemon/native/goodvibes-daemon-macos-${NATIVE_TARGET#darwin-}"
          test -x "$daemon"
          target="gui/$(id -u)/sh.goodvibes.daemon"
          launchd_pid() { launchctl print "$target" | sed -n 's/^[[:space:]]*pid = \([0-9][0-9]*\)[[:space:]]*$/\1/p' | head -n 1; }
          # launchd spawns a bootstrapped job at once; allow it 10 seconds to show a pid.
          wait_pid() { i=0; while [ "$i" -lt 40 ]; do p=$(launchd_pid); if [ -n "$p" ]; then echo "$p"; return 0; fi; sleep 0.25; i=$((i + 1)); done; return 1; }
          not_in_domain() { rc=0; launchctl print "$target" >/dev/null 2>&1 || rc=$?; test "$rc" = 113; }
          ssh_key="$RUNNER_TEMP/launchd-ssh-key"
          ssh_opts="-n -i $ssh_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR"
          # A daemon command from this session (local) or through an SSH login to this Mac (ssh).
          via() { if [ "$1" = ssh ]; then shift; ssh $ssh_opts "$(id -un)@localhost" "$*"; else shift; "$@"; fi; }
          status_pid() { via "$1" "$daemon" service-status --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).data;console.log(d.running?d.pid:"stopped")})'; }
          service_round() {
            via "$1" "$daemon" install-service
            first=$(wait_pid); test "$(status_pid "$1")" = "$first"
            via "$1" "$daemon" restart-service
            second=$(wait_pid); test "$second" != "$first"; test "$(status_pid "$1")" = "$second"
            via "$1" "$daemon" stop-service
            not_in_domain; test "$(status_pid "$1")" = stopped
            via "$1" "$daemon" start-service
            wait_pid >/dev/null
            via "$1" "$daemon" uninstall-service
            not_in_domain; test ! -e "$HOME/Library/LaunchAgents/sh.goodvibes.daemon.plist"
          }
          "$daemon" config set update.auto false
          "$daemon" config set update.autoUpdateAtLaunch false
          echo "launchd context of this session: $(launchctl managername)"
          service_round local
          # Remote Login with a key made for this run; sshd is loaded from the system's own definition when it is off.
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_key"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          cat "$ssh_key.pub" >> "$HOME/.ssh/authorized_keys" && chmod 600 "$HOME/.ssh/authorized_keys"
          sudo launchctl enable system/com.openssh.sshd 2>/dev/null || true
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          if ssh_context=$(ssh $ssh_opts "$(id -un)@localhost" launchctl managername); then
            echo "launchd context of an SSH login: $ssh_context"
            if [ "$ssh_context" = Aqua ]; then
              echo "::warning title=launchd over SSH::The SSH login ran in the GUI (Aqua) launchd context on this runner, so the round below does not exercise the background domain."
            fi
            service_round ssh
          else
            echo "::warning title=launchd over SSH::Remote Login could not be reached on this runner, so the service commands were not run from an SSH login; the round from this session above did run."
          fi
      # A daemon that died by a signal anywhere above (the verifier's own
      # children print their output and report themselves) leaves a macOS crash
      # report: print each one's exception, messages and crashed thread, and
      # keep the files.
      - name: Show the daemon's crash reports
        if: failure() && matrix.platform == 'darwin'
        run: node products/daemon/scripts/darwin-crash-reports.mjs --copy-to "$RUNNER_TEMP/daemon-crash-reports"
      - name: Keep the daemon's crash reports
        if: failure() && matrix.platform == 'darwin'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-crash-reports-${{ matrix.target }}
          path: ${{ runner.temp }}/daemon-crash-reports
          retention-days: 7
          if-no-files-found: ignore

  # The one job a branch rule and the release gate require (release.yml's
  # ci-green reads its "CI ok" check run). It fails when any other job did not
  # succeed; only `native` may be skipped, and only on a pull request.
  ci-ok:
    name: CI ok
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - gates
      - build
      - typecheck
      - proofs
      - live-sandbox
      - measure
      - package
      - security-audit
      - native
    steps:
      - name: Every CI job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          pull_request = os.environ["EVENT"] == "pull_request"
          bad = {
              name: job["result"]
              for name, job in json.load(sys.stdin).items()
              if job["result"] != "success" and not (name == "native" and pull_request and job["result"] == "skipped")
          }
          if bad:
              sys.exit("CI jobs that did not succeed: " + ", ".join(f"{n} ({r})" for n, r in sorted(bad.items())))
          print("Every CI job succeeded.")
          '
