name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Default to read-only permissions. Individual jobs elevate as needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Integration gate: typecheck, browser compat, metadata, no-any, pack check,
  # install smoke. Deliberately self-contained, this is the 'everything works
  # atomically' check that matches what a local developer runs via
  # `bun run validate`.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    # pack:check packs every workspace package and dominates the run time;
    # individual bun tests carry their own timeouts, so this only bounds a hang.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Validate workspace
        run: bun run validate
      - name: Test release asset consistency
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_asset_*.py'
      - name: Build TUI native artifact
        run: |
          bun run --cwd products/tui smoke:tui
          tar -czf /tmp/tui-native-linux-x64.tgz \
            products/tui/dist/goodvibes-linux-x64 \
            products/tui/dist/goodvibes-linux-x64.bun \
            products/tui/dist/goodvibes-linux-x64.bun.LICENSE.md \
            products/tui/dist/goodvibes-linux-x64.bun.json \
            products/tui/dist/lib/sqlite-vec-linux-x64/vec0.so
      - name: Upload TUI native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tui-native-linux-x64
          path: /tmp/tui-native-linux-x64.tgz
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Standing eval gate. Runs the all-floors-passing standing-gate suite through
  # the production eval paths and fails on ANY absolute-floor failure OR
  # regression versus the checked-in baseline (eval/baseline.json). The
  # baseline drift check runs first so a stale baseline (suites/scorer changed
  # without a deliberate `bun run eval:baseline`) fails loudly.
  # ---------------------------------------------------------------------------
  eval-gate:
    name: Eval gate (floors + regression)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      # The eval scripts execute engine source directly, and that source imports
      # bare workspace specifiers whose package exports resolve to ./dist.
      - name: Restore workspace package output
        uses: ./.github/actions/restore-build
      - name: Baseline drift check
        run: bun run eval:baseline:check
      - name: Run eval gate
        run: bun run eval:gate

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Dependency audit
        run: bun audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Single build job. Uploads all package dist directories as one artifact so
  # every downstream job tests the exact same workspace package bytes.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Build shared engine packages
        # Product builds run once in validate. This artifact contains only the
        # engine/judgment output and the separately built Agent E2E binary.
        run: bun packages/engine/scripts/build.ts
      - name: Build Agent native E2E artifact
        run: |
          bun run --cwd products/agent build:binary --target linux-x64
          products/agent/dist/goodvibes-agent-linux-x64 --version
      - name: Archive workspace package output
        run: |
          tar -czf /tmp/workspace-build-output.tgz packages/engine/*/dist packages/judgment/dist \
            products/agent/dist/goodvibes-agent-linux-x64 products/agent/dist/lib \
            products/agent/dist/goodvibes-agent-linux-x64.bun \
            products/agent/dist/goodvibes-agent-linux-x64.bun.LICENSE.md \
            products/agent/dist/goodvibes-agent-linux-x64.bun.json
      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-build-output
          path: /tmp/workspace-build-output.tgz
          # Short retention: only this run's downstream jobs consume it.
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Engine tests: nine disjoint partitions of the engine suite (selected by the
  # runner itself with --partition=INDEX/9) plus the companion runtimes. Every
  # leg restores the build job's compiled output. Partition 1 also owns the
  # installer lifecycle, judgment and the deterministic fake-IMAP sweep;
  # partition 9 holds the dedicated native workflow suite, whose declared
  # four-minute test sets its own timeout.
  # ---------------------------------------------------------------------------
  platform-matrix:
    name: Platform matrix (${{ matrix.name }})
    # Process-group timeout proofs require GNU coreutils, supplied by this image.
    runs-on: ubuntu-24.04
    # Slowest partition: ~10.5 min on a 12-core workstation (single bun process).
    timeout-minutes: 35
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "bun 1/9", foundation: true, test-cmd: "bun packages/engine/scripts/test.ts --partition=1/9" }
          - { name: "bun 2/9", foundation: false, test-cmd: "bun packages/engine/scripts/test.ts --partition=2/9" }
          - { name: "bun 3/9", foundation: false, test-cmd: "bun packages/engine/scripts/test.ts --partition=3/9" }
          - { name: "bun 4/9", foundation: false, test-cmd: "bun packages/engine/scripts/test.ts --partition=4/9" }
          - { name: "bun 5/9", foundation: false, test-cmd: "bun packages/engine/scripts/test.ts --partition=5/9" }
          - { name: "bun 6/9", foundation: false, test-cmd: "bun packages/engine/scripts/test.ts --partition=6/9" }
          - { name: "bun 7/9", foundation: false, test-cmd: "bun packages/engine/scripts/test.ts --partition=7/9" }
          - { name: "bun 8/9", foundation: false, test-cmd: "bun packages/engine/scripts/test.ts --partition=8/9" }
          - { name: "bun 9/9", foundation: false, test-cmd: "bun packages/engine/scripts/test.ts --partition=9/9" }
          - { name: rn-bundle, foundation: false, test-cmd: "bun run test:rn" }
          - { name: workers, foundation: false, test-cmd: "bun run test:workers" }
          - { name: workers-wrangler, foundation: false, test-cmd: "bun run test:workers:wrangler" }
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Restore workspace package output
        uses: ./.github/actions/restore-build
      - name: Configure git identity for worktree/orchestration tests
        # The orchestration worktree flow makes real git commits and relies on
        # ambient git config. A fresh CI runner has no identity, so those
        # commits fail and the worktree integration tests hang.
        run: |
          git config --global user.email "ci@goodvibes.local"
          git config --global user.name "GoodVibes CI"
      - name: Run test suite (${{ matrix.name }})
        run: ${{ matrix.test-cmd }}
      - name: Check installer lifecycle
        if: matrix.foundation
        run: bun run test:installer
      - name: Run judgment suite
        if: matrix.foundation
        run: bun run test:judgment
      - name: Sweep the fake-IMAP suites for the lost-wake race
        # Re-runs ordinary suites with one wire call delayed so a wake edge a
        # test pushes at the wrong moment is reliably lost instead of
        # occasionally lost. Cheap and deterministic; see the script's header.
        if: matrix.foundation
        run: bun run sweep:wake-race

  # Product test suites for the products that have no dedicated lane below.
  # The daemon leg also produces the Linux x64 native artifact.
  product-tests:
    name: Product tests (${{ matrix.product }})
    runs-on: ubuntu-latest
    # Measured on a 12-core workstation with --jobs=auto: tui 4.3 min, daemon 9.1 min
    # (including `bun run build`), then the daemon native build; hosted runners have 4 vCPUs.
    timeout-minutes: 45
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        product: [daemon, tui, webui]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Restore workspace package output
        uses: ./.github/actions/restore-build
      - name: Configure git identity for product worktree tests
        run: |
          git config --global user.email "ci@goodvibes.local"
          git config --global user.name "GoodVibes CI"
      - name: Run complete declared product test suite
        id: product-test-run
        env:
          PRODUCT: ${{ matrix.product }}
        run: bun run products:test "$PRODUCT"

      # Only this matrix leg produces the daemon binary; consumers never rebuild
      # it. ci-artifact.json is part of the archive cohort that
      # products/daemon/scripts/acquire-native.ts admits from this run.
      - name: Build and record daemon native artifact
        if: matrix.product == 'daemon'
        env:
          DAEMON_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bun run --cwd products/daemon build:binary --target linux-x64
          bun products/daemon/scripts/ci-artifact.ts record "$GITHUB_SHA" "$DAEMON_SOURCE_HEAD"
          tar -czf /tmp/daemon-native-linux-x64.tgz \
            products/daemon/native/goodvibes-daemon-linux-x64 \
            products/daemon/native/goodvibes-daemon-linux-x64.bun \
            products/daemon/native/goodvibes-daemon-linux-x64.bun.LICENSE.md \
            products/daemon/native/goodvibes-daemon-linux-x64.bun.json \
            products/daemon/native/lib/sqlite-vec-linux-x64/vec0.so \
            products/daemon/native/ci-artifact.json
      - name: Upload daemon native artifact
        if: matrix.product == 'daemon'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-native-linux-x64
          path: /tmp/daemon-native-linux-x64.tgz
          retention-days: 7
          if-no-files-found: error

  daemon-native:
    name: Daemon native artifact (isolated Linux)
    # Match the live containment lanes: no host security relaxation.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [build, product-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Install filesystem isolation harness
        uses: ./.github/actions/apt-install
        with:
          packages: bubblewrap
      - name: Restore workspace package output
        uses: ./.github/actions/restore-build
      - name: Download daemon native artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-native-linux-x64
          path: /tmp/daemon-native-artifact
      - name: Restore daemon native artifact
        run: tar -xzf /tmp/daemon-native-artifact/daemon-native-linux-x64.tgz -C .
      - name: Qualify isolated daemon commands and synthetic send
        run: bun run --cwd products/daemon verify:binary

  # Native production occurs once per target; restored consumers never build.
  daemon-native-produce:
    name: Daemon native producer (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            platform: linux
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            platform: darwin
            runner: macos-15-intel
          - target: darwin-arm64
            platform: darwin
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Restore canonical workspace package output
        uses: ./.github/actions/restore-build
      - name: Build exact native target
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: bun products/daemon/scripts/build-native-ci.ts "$NATIVE_TARGET"
      - name: Archive Linux ARM cohort
        if: matrix.platform == 'linux'
        env:
          DAEMON_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bun products/daemon/scripts/ci-artifact.ts record "$GITHUB_SHA" "$DAEMON_SOURCE_HEAD"
          tar -czf /tmp/daemon-native-linux-arm64.tgz \
            products/daemon/native/goodvibes-daemon-linux-arm64 \
            products/daemon/native/goodvibes-daemon-linux-arm64.bun \
            products/daemon/native/goodvibes-daemon-linux-arm64.bun.LICENSE.md \
            products/daemon/native/goodvibes-daemon-linux-arm64.bun.json \
            products/daemon/native/lib/sqlite-vec-linux-arm64/vec0.so \
            products/daemon/native/ci-artifact.json
      - name: Record and archive Darwin execution cohort
        if: matrix.platform == 'darwin'
        env:
          DAEMON_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          node products/daemon/scripts/native-execution-artifact.mjs record "$GITHUB_SHA" "$DAEMON_SOURCE_HEAD"
          node products/daemon/scripts/native-execution-artifact.mjs archive "$GITHUB_SHA" "$DAEMON_SOURCE_HEAD" "/tmp/daemon-native-${NATIVE_TARGET}.tgz"
      - name: Upload exact native cohort
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-native-${{ matrix.target }}
          path: /tmp/daemon-native-${{ matrix.target }}.tgz
          retention-days: 7
          if-no-files-found: error

  daemon-native-execution:
    name: Daemon restored native execution (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    needs: [build, daemon-native-produce]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            platform: linux
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            platform: darwin
            runner: macos-15-intel
          - target: darwin-arm64
            platform: darwin
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Install filesystem isolation harness
        if: matrix.platform == 'linux'
        uses: ./.github/actions/apt-install
        with:
          packages: bubblewrap
      - name: Restore canonical workspace package output
        uses: ./.github/actions/restore-build
      - name: Download exact native cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-native-${{ matrix.target }}
          path: /tmp/daemon-native-artifact
      - name: Restore exact native cohort
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: tar -xzf "/tmp/daemon-native-artifact/daemon-native-${NATIVE_TARGET}.tgz" -C .
      - name: Execute isolated Linux ARM cohort
        if: matrix.platform == 'linux'
        run: node products/daemon/scripts/verify-binary.mjs --binary native/goodvibes-daemon-linux-arm64
      - name: Verify installer open file identity on Darwin
        if: matrix.platform == 'darwin'
        run: bun packages/engine/scripts/test.ts --cwd ../.. scripts/installer-open-file-identity.test.ts
      - name: Verify and execute portable Darwin cohort
        if: matrix.platform == 'darwin'
        env:
          DAEMON_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node products/daemon/scripts/native-execution-artifact.mjs verify "$GITHUB_SHA" "$DAEMON_SOURCE_HEAD"
          node products/daemon/scripts/verify-native-execution.mjs "$GITHUB_SHA" "$DAEMON_SOURCE_HEAD"

  # The whole Agent suite, split into eight even shards by sorted file index
  # (every test file is in exactly one shard by construction). The two native
  # catalog fixtures run in their own runner invocation on shard 0 because they
  # must stay isolated from unrelated globals. Each file runs in its own bun
  # process (--jobs=auto: up to four at a time), so files cannot leak state into
  # one another.
  agent-tests:
    name: Agent tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # Slowest shard measured at ~9.5 min (shard 0 with the catalog fixtures) on a 12-core workstation.
    timeout-minutes: 35
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Restore workspace package output
        uses: ./.github/actions/restore-build
      - name: Select the restored Agent native binary for E2E files
        run: |
          products/agent/dist/goodvibes-agent-linux-x64 --version
          echo "GOODVIBES_E2E_BINARY=$GITHUB_WORKSPACE/products/agent/dist/goodvibes-agent-linux-x64" >> "$GITHUB_ENV"
      - name: Install Agent terminal E2E prerequisite
        uses: ./.github/actions/apt-install
        with:
          packages: tmux
      - name: Configure git identity for product worktree tests
        run: |
          git config --global user.email "ci@goodvibes.local"
          git config --global user.name "GoodVibes CI"
      - name: Run Agent test shard
        id: agent-test-run
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(cd products/agent && find src/test -type f -regextype posix-extended -regex '.*\.(test|spec)\.[cm]?[jt]sx?' \
            -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.git/*' \
            | LC_ALL=C sort \
            | grep -v -e '/agent-harness-tool\.test\.ts$' -e '/agent-harness-semantic-record-catalogs\.test\.ts$' \
            | awk -v shard="$SHARD" 'NR % 8 == shard' | sed 's|^|./|')
          echo "Agent shard $SHARD: ${#files[@]} files"
          test "${#files[@]}" -gt 0
          bun packages/engine/scripts/test.ts --cwd ../../products/agent --jobs=auto "${files[@]}"
      - name: Run the isolated native catalog fixtures
        if: ${{ !cancelled() && matrix.shard == 0 }}
        run: bun packages/engine/scripts/test.ts --cwd ../../products/agent --jobs=2 ./src/test/tools/agent-harness-tool.test.ts ./src/test/tools/agent-harness-semantic-record-catalogs.test.ts

  # Exact TUI source, production migration handlers and real owner-terminal input.
  # The ordinary TUI product runner intentionally excludes E2E files.
  tui-host-pair-terminal:
    name: TUI host pairing (compiled terminal)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install official terminal harness package
        uses: ./.github/actions/apt-install
        with:
          packages: tmux
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Restore workspace package output
        uses: ./.github/actions/restore-build
      - name: Download TUI native artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tui-native-linux-x64
          path: /tmp/tui-native-artifact
      - name: Restore TUI native artifact
        run: |
          tar -xzf /tmp/tui-native-artifact/tui-native-linux-x64.tgz -C .
          products/tui/dist/goodvibes-linux-x64 --version
      - name: Qualify host pairing, native integration, passive history and interruption recovery
        env:
          GOODVIBES_E2E_BINARY: ${{ github.workspace }}/products/tui/dist/goodvibes-linux-x64
        run: bun packages/engine/scripts/test.ts --cwd ../../products/tui --timeout=300000 src/test/e2e/host-pair-terminal.e2e.test.ts src/test/e2e/host-pair-interactive.e2e.test.ts src/test/e2e/planning-history.e2e.test.ts src/test/e2e/native-integration.e2e.test.ts

  # The WebUI browser suite (phone, desktop and the genuine LAN origin) on two
  # runners using Playwright's own sharding. Each retains two workers and every
  # assertion.
  webui-browser:
    name: WebUI browser (shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    defaults:
      run:
        working-directory: products/webui
        shell: bash
    env:
      DESIGN_PROOF_SHOTS: e2e/.artifacts/screenshots
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Restore workspace package output
        uses: ./.github/actions/restore-build
      - name: Install official Playwright Chromium and OS dependencies
        run: |
          # Use the lockfile-installed CLI and its exact Chromium revision. Browser
          # acquisition does not need a broad package-index refresh on a ready host.
          timeout --signal=KILL 180s node node_modules/@playwright/test/cli.js install chromium
          if timeout --signal=KILL 30s bun scripts/ci-browser-smoke.ts; then
            exit 0
          else
            probe_status=$?
          fi
          # Never retry after a timed-out controller: Chromium owns a detached
          # process group, so hard-kill cleanup belongs to runner teardown.
          if (( probe_status == 124 || probe_status >= 128 )); then
            exit "$probe_status"
          fi
          # If the actual browser cannot run, install the official dependency set.
          sudo -n timeout --signal=KILL 180s "$(command -v node)" "$(realpath node_modules/@playwright/test/cli.js)" install-deps chromium
          timeout --signal=KILL 30s bun scripts/ci-browser-smoke.ts
      - name: Check workspace exports and generated data
        run: bun run release:gate && bun run generated:check
      - name: Exercise the production app with synthetic daemon fixtures
        run: node node_modules/@playwright/test/cli.js test --shard=${{ matrix.shard }}/2 --workers=2
      - name: Retain report, traces, and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webui-browser-shard-${{ matrix.shard }}
          path: |
            products/webui/e2e/.artifacts/report
            products/webui/e2e/.artifacts/test-output
            products/webui/e2e/.artifacts/screenshots
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # A separate, mandatory live OS-boundary proof. Pin a supported VM runner
  # with unprivileged namespaces; never disable AppArmor, change sysctls, or
  # run the fixtures as root to make a failing host look supported. Two lanes,
  # each running its fixture groups one after another.
  exec-containment-proof:
    name: Exec containment proof (live bubblewrap, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [a, b]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install official sandbox and PTY packages
        uses: ./.github/actions/apt-install
        with:
          packages: bubblewrap util-linux
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Restore workspace package output
        uses: ./.github/actions/restore-build
      - name: Require actual sandbox fixture execution
        env:
          GOODVIBES_TEST_REQUIRE_EXEC_CONTAINMENT: "1"
          LANE: ${{ matrix.lane }}
        run: |
          case "$LANE" in
            a)
              bun packages/engine/scripts/test.ts test/exec-interactive.test.ts test/exec-sandbox.test.ts test/exec-containment-proof.test.ts test/captured-exec.test.ts test/captured-exec-modes.test.ts test/captured-exec-file-ops.test.ts test/captured-exec-runtime-input.test.ts test/captured-edit-write.test.ts
              bun packages/engine/scripts/test.ts test/contract/actual-direct-exec-input-authority.test.ts test/captured-direct-exec-compiled.test.ts
              bun packages/engine/scripts/test.ts --cwd ../../products/agent ./src/test/tools/owner-terminal-guard.test.ts ./src/test/runtime/exec-cancellation-wrappers.test.ts ./src/test/tools/tool-execution-safety.test.ts
              bun packages/engine/scripts/test.ts test/captured-auto-heal-real-tools.test.ts
              ;;
            b)
              bun packages/engine/scripts/test.ts test/captured-repl.test.ts test/captured-repl-compiled.test.ts test/captured-bun-runtime-input.test.ts test/contract/actual-repl-input-authority.test.ts test/contract/actual-repl-run-history.test.ts test/contract/actual-repl-history-cancellation.test.ts
              # Real dependency capture and validators have a 300-second test
              # budget, declared by the tests themselves.
              bun packages/engine/scripts/test.ts test/contract/actual-input-authority-graph.test.ts test/contract/actual-edit-write-input-authority.test.ts test/contract/actual-validator-runtime.test.ts test/captured-passive-context-pipeline.test.ts
              bun packages/engine/scripts/test.ts test/captured-auto-heal-candidate.test.ts test/captured-auto-heal-revision.test.ts test/captured-auto-heal.test.ts test/captured-auto-heal-backend-isolation.test.ts test/captured-auto-heal-rollback.test.ts test/contract/actual-captured-auto-heal.test.ts
              ;;
            *) exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # Packaged-artifact coherence gate: pack every workspace package exactly as
  # publish would, install the tarballs into a scratch consumer, and run the
  # shipped conformance kit against a catalog/daemon composed FROM THE PACKED
  # ARTIFACTS (descriptors-have-handlers, catalog invoke round-trips, REST
  # parity). Proves the tarballs are internally coherent before publish.
  # ---------------------------------------------------------------------------
  artifact-lane:
    name: Packaged-artifact release lane (conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Restore workspace package output
        uses: ./.github/actions/restore-build
      - name: Run packaged-artifact release lane
        run: bun run release:artifact-lane
