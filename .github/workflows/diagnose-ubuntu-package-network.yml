name: Diagnose Ubuntu package network

on:
  workflow_dispatch:
    inputs:
      mirror-mode:
        description: Canonical Ubuntu hosts or independent transport of the same signed Ubuntu archive.
        type: choice
        required: false
        default: canonical
        options:
          - canonical
          - independent

permissions:
  contents: read

jobs:
  package-network:
    name: Ubuntu22 signed packages and sandbox (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Observe resolver, official archive and real sandbox capabilities
        env:
          DIAGNOSTIC_ARCH: ${{ matrix.arch }}
          DIAGNOSTIC_MIRROR_MODE: ${{ inputs.mirror-mode }}
        run: python3 .github/scripts/diagnose-ubuntu-package-network.py "$RUNNER_TEMP/ubuntu-package-network-$DIAGNOSTIC_ARCH.json"
      - name: Preserve bounded safe network evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-ubuntu-package-network-${{ matrix.arch }}
          path: ${{ runner.temp }}/ubuntu-package-network-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7
