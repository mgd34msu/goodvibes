name: Probe macOS SQLite descriptor loading

# Inert loader feasibility only. Original compiled Bun and SQLite bytes are
# downloaded unchanged; no application, service, build or publication executes.
on:
  workflow_dispatch:
    inputs:
      tooling-sha:
        description: Full commit containing the inert SQLite descriptor probe.
        required: true
        type: string
      artifact-run-id:
        description: Existing staged artifact containing the original compiled daemon and SQLite cohort.
        required: true
        type: string
        default: '42941236483'

permissions:
  contents: read
  actions: read

jobs:
  sqlite-fd:
    name: Original compiled runtime SQLite descriptor probe (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            arch: x64
            runner: macos-15-intel
          - target: darwin-arm64
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
      - name: Verify immutable probe inputs
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          test -f scripts/probe-macos-sqlite-fd.mjs
      - name: Download original compiled runtime and SQLite cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staged-release-assets
          path: ${{ runner.temp }}/original-staged-assets
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the original compiled runtime for interpreter mode
        id: prepare
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/original-staged-assets/sqlite-$NATIVE_TARGET.dylib"
          test -f "$RUNNER_TEMP/original-staged-assets/sqlite-$NATIVE_TARGET.dylib.json"
          chmod 0755 "$RUNNER_TEMP/original-staged-assets/goodvibes-daemon-macos-$NATIVE_ARCH"
      - name: Probe a held original descriptor after pathname retirement
        env:
          BUN_BE_BUN: '1'
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: '"$RUNNER_TEMP/original-staged-assets/goodvibes-daemon-macos-$NATIVE_ARCH" scripts/probe-macos-sqlite-fd.mjs positive "$RUNNER_TEMP/original-staged-assets/sqlite-$NATIVE_TARGET.dylib" "$RUNNER_TEMP/original-staged-assets/sqlite-$NATIVE_TARGET.dylib.json" "$RUNNER_TEMP/fd-positive.json"'
      - name: Probe an invalid descriptor without pathname fallback
        if: >-
          !cancelled() && steps.prepare.outcome == 'success'
        env:
          BUN_BE_BUN: '1'
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: '"$RUNNER_TEMP/original-staged-assets/goodvibes-daemon-macos-$NATIVE_ARCH" scripts/probe-macos-sqlite-fd.mjs negative "$RUNNER_TEMP/original-staged-assets/sqlite-$NATIVE_TARGET.dylib" "$RUNNER_TEMP/original-staged-assets/sqlite-$NATIVE_TARGET.dylib.json" "$RUNNER_TEMP/fd-negative.json"'
      - name: Preserve bounded descriptor feasibility results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-sqlite-fd-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/fd-positive.json
            ${{ runner.temp }}/fd-negative.json
          if-no-files-found: warn
          retention-days: 7
