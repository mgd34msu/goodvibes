name: Release

# Default to read-only permissions. Individual jobs elevate as needed.
# The `production` environment (referenced by publish-npm) must be configured in
# GitHub repo settings with required reviewers and deployment branch
# restrictions (tags only). This YAML alone cannot enforce manual approval; the
# gate lives in the GitHub UI at Settings > Environments > production.
#
# Release assets are built from the selected source in this workflow.
# Fresh and upgrade installation acceptance must pass before publication.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run preview, candidate acceptance without a tag or publication, or release an existing tag"
        required: false
        type: choice
        options:
          - dry-run
          - candidate
          - release
        default: dry-run
      tag:
        description: "Existing release tag, or the version label for candidate mode (no tag required)"
        required: false
        default: ""
      source:
        description: "Full payload commit SHA for candidate mode only; no tag is created"
        required: false
        default: ""
      dry_run:
        description: "Legacy dry-run guard (used only for a non-release dispatch)"
        required: false
        default: "true"
      ref:
        description: "Git ref to dry-run (ignored in release mode, which uses the dispatched tag ref)"
        required: false
        default: "main"
  push:
    tags:
      - "v*"

concurrency:
  # Keyed on the TAG being released, so the two paths that can release the same
  # version serialize with each other: a v* tag push and ci.yml's auto-release
  # dispatch both run at refs/tags/vX, so both produce engine-release-vX. Different
  # versions get different groups and never evict one another.
  #
  # A non-release dispatch (dry-run) is keyed on run_id instead: it writes
  # nothing, so parallel manual dry-runs are fine and must not queue behind a
  # real release. The `ref` input is deliberately NOT part of the key; it
  # defaults to "main", which would collapse every dispatch into one group.
  group: engine-release-${{ (github.event_name == 'push' || github.event.inputs.mode == 'release') && (github.event.inputs.tag || github.ref_name) || github.run_id }}
  cancel-in-progress: false

jobs:
  verify-tag-version:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'release' || github.event.inputs.mode == 'candidate'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Resolve immutable release tag
        id: source
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CALLER_REF: ${{ github.ref_name }}
          PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
          RELEASE_MODE: ${{ github.event.inputs.mode }}
          CANDIDATE_SOURCE: ${{ github.event.inputs.source }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo 'A version tag label is required.' >&2; exit 1; }
          if [ "${RELEASE_MODE:-}" = candidate ]; then
            [[ "${CANDIDATE_SOURCE:-}" =~ ^[0-9a-f]{40}$ ]] || { echo 'Candidate mode requires a full commit SHA.' >&2; exit 1; }
            source_ref="$CANDIDATE_SOURCE"
          else
            test -z "${CANDIDATE_SOURCE:-}" || { echo 'The source input is candidate-only.' >&2; exit 1; }
            if [ "$PUBLISH_NPM" = true ] && [ "$RELEASE_TAG" != "$CALLER_REF" ]; then
              echo 'npm publication must execute at its own tag ref.' >&2
              exit 1
            fi
            source_ref="refs/tags/$RELEASE_TAG"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify git tag matches package.json version
        id: version
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_MODE: ${{ github.event.inputs.mode }}
          CANDIDATE_SOURCE: ${{ github.event.inputs.source }}
        run: |
          if [ "$RELEASE_MODE" = candidate ]; then test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"; fi
          GITHUB_REF_NAME="$RELEASE_TAG" bun packages/engine/scripts/verify-release-tag-version.ts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A manual dispatch defaults to dry-run. Only an explicit release-mode
  # dispatch or a tag push may reach the publish job below.
  dry-run:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'release' && github.event.inputs.mode != 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Reject manual non-dry-run release
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "workflow_dispatch releases are dry-run only; push a verified v* tag to publish." >&2
          exit 1
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Release dry run (pack + publish preview, no registry write)
        run: bun run release:dry-run

  publish-npm:
    # Registry publication is an explicit opt-in; native GitHub releases do
    # not require npm credentials or a previously published engine package.
    # Registry writes and latest-tag alignment share one owner across versions.
    concurrency:
      group: engine-npm-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify-tag-version, staged-install-acceptance]
    if: >-
      !cancelled() &&
      vars.PUBLISH_NPM == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')) &&
      needs.verify-tag-version.result == 'success' &&
      needs.staged-install-acceptance.result == 'success'
    environment:
      name: production
      url: https://www.npmjs.com/package/@goodvibes-jev/engine
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag-version.outputs.tag }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build release packages from the tag
        run: bun run build
      # Empty, complete, or a partial at exactly this version (the shape a
      # mid-loop publish failure leaves, which the publish loop's per-package
      # skip converges) all proceed. The stop condition is a published package
      # whose recorded gitHead is a DIFFERENT commit than the one being
      # released. See scripts/verify-published-packages.ts.
      - name: Check the npm registry state for this version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GOODVIBES_RELEASE_SHA: ${{ github.sha }}
        run: bun packages/engine/scripts/verify-published-packages.ts --prepublish-registry-state
      - name: Publish packages (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release:publish:ci
      - name: Verify published packages (propagation poll)
        env:
          GOODVIBES_VERIFY_ATTEMPTS: "48"
          GOODVIBES_VERIFY_DELAY_MS: "5000"
        run: bun run release:verify:published
      # npm publish with no --tag moves `latest` to whatever it just published,
      # so two releases of DIFFERENT versions that overlap leave `latest`
      # pointing backward on every package where the older run landed last.
      # This job serializes publishing and alignment across all versions.
      # Run after propagation so the registry snapshot includes this release.
      - name: Align the latest dist-tag with the highest published version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun packages/engine/scripts/align-dist-tags.ts

  complete-suite-assets:
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'release' || github.event.inputs.mode == 'candidate')))
    needs: [verify-tag-version]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/suite-release-assets.yml
    with:
      tag: ${{ needs.verify-tag-version.outputs.tag }}
      candidate-source: ${{ github.event.inputs.mode == 'candidate' && needs.verify-tag-version.outputs.sha || '' }}
      publish_existing: false

  prepare-native-assets:
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'release' || github.event.inputs.mode == 'candidate'))) &&
      needs.verify-tag-version.result == 'success' &&
      needs.complete-suite-assets.result == 'success'
    needs: [verify-tag-version, complete-suite-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout released source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag-version.outputs.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Select the published engine version
        id: version
        env:
          RELEASE_TAG: ${{ needs.verify-tag-version.outputs.tag }}
        run: |
          version=$(bun -e 'console.log(JSON.parse(await Bun.file("packages/engine/package.json").text()).version)')
          test "v$version" = "$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download freshly built complete installer assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-release-assets
          path: /tmp/native-release-assets
      - name: Upload native release assets for installation acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release-assets
          path: /tmp/native-release-assets/*
          retention-days: 7
          if-no-files-found: error

  staged-install-acceptance:
    # Skip npm ancestors without skipping native acceptance; every fresh and previous-release staged lane
    # must finish successfully before the first public release is created.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'release' || github.event.inputs.mode == 'candidate'))) &&
      needs.verify-tag-version.result == 'success' &&
      needs.prepare-native-assets.result == 'success'
    needs: [verify-tag-version, prepare-native-assets]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-staged-install-acceptance.yml
    with:
      tag: ${{ needs.verify-tag-version.outputs.tag }}
      source: ${{ needs.verify-tag-version.outputs.sha }}
      tooling-sha: ${{ github.sha }}
      previous-tag: ${{ needs.verify-tag-version.outputs.tag == 'v3.1.5' && 'v3.1.4' || needs.verify-tag-version.outputs.tag == 'v3.1.4' && 'v3.1.3' || needs.verify-tag-version.outputs.tag == 'v3.1.3' && 'v3.1.2' || '' }}
      previous-source: ${{ needs.verify-tag-version.outputs.tag == 'v3.1.5' && '9c19f683bf3e19250e64a04ae6c8c8f4a3988522' || needs.verify-tag-version.outputs.tag == 'v3.1.4' && '0065d6726d4d9fe3f800e255711b6cf8d78d0d72' || needs.verify-tag-version.outputs.tag == 'v3.1.3' && 'a5ddf1f151466590eaed4ab387b2f95be7112a86' || '' }}
      artifact-run-id: ${{ format('{0}', github.run_id) }}

  github-release:
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')) &&
      (needs.publish-npm.result == 'success' ||
       (vars.PUBLISH_NPM != 'true' && needs.publish-npm.result == 'skipped')) &&
      needs.prepare-native-assets.result == 'success' &&
      needs.staged-install-acceptance.result == 'success'
    needs: [verify-tag-version, publish-npm, prepare-native-assets, staged-install-acceptance]
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-gh-release.yml
    with:
      tag: ${{ needs.verify-tag-version.outputs.tag }}
      artifact-name: staged-release-assets
      use-existing-checksums: true
      assets-glob: dist/*
      notes-file: docs/releases/{version}.md
      changelog-path: packages/engine/CHANGELOG.md
      toolchain-source: workspace
