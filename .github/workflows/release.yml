name: Release

# Default to read-only permissions. Individual jobs elevate as needed.
# The `production` environment (referenced by publish-npm) must be configured in
# GitHub repo settings with required reviewers and deployment branch
# restrictions (tags only). This YAML alone cannot enforce manual approval; the
# gate lives in the GitHub UI at Settings > Environments > production.
#
# By-reference release (2026-07-16 redesign): validation happened exactly once,
# on the release commit's push-CI run. This workflow VERIFIES that run is
# per-job green (release-verify, ~2m) instead of re-running the 45-minute gate
# suite, then restores that CI run's build artifact for publish after an
# integrity check (recorded head SHA == tagged SHA). Tagging is gated on push-CI
# green, which structurally retires the tag-redo dance.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default; pack preview, no registry write) or release (publish the dispatched tag)"
        required: false
        type: choice
        options:
          - dry-run
          - release
        default: dry-run
      tag:
        description: "Existing native release tag to resume using current publishing tooling; npm must be disabled when dispatching from another ref"
        required: false
        default: ""
      dry_run:
        description: "Legacy dry-run guard (used only for a non-release dispatch)"
        required: false
        default: "true"
      ref:
        description: "Git ref to dry-run (ignored in release mode, which uses the dispatched tag ref)"
        required: false
        default: "main"
  push:
    tags:
      - "v*"

concurrency:
  # Keyed on the TAG being released, so the two paths that can release the same
  # version serialize with each other: a v* tag push and ci.yml's auto-release
  # dispatch both run at refs/tags/vX, so both produce engine-release-vX. Different
  # versions get different groups and never evict one another.
  #
  # A non-release dispatch (dry-run) is keyed on run_id instead: it writes
  # nothing, so parallel manual dry-runs are fine and must not queue behind a
  # real release. The `ref` input is deliberately NOT part of the key; it
  # defaults to "main", which would collapse every dispatch into one group.
  group: engine-release-${{ (github.event_name == 'push' || github.event.inputs.mode == 'release') && (github.event.inputs.tag || github.ref_name) || github.run_id }}
  cancel-in-progress: false

jobs:
  verify-tag-version:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Resolve immutable release tag
        id: source
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CALLER_REF: ${{ github.ref_name }}
          PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo 'An existing version tag is required.' >&2; exit 1; }
          if [ "$PUBLISH_NPM" = true ] && [ "$RELEASE_TAG" != "$CALLER_REF" ]; then
            echo 'npm publication must execute at its own tag ref.' >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ steps.source.outputs.tag }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify git tag matches package.json version
        id: version
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          GITHUB_REF_NAME="$RELEASE_TAG" bun packages/engine/scripts/verify-release-tag-version.ts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # By-reference validation: verify the tagged commit's push-CI run is per-job
  # green. Replaces the old 45-minute validate-release re-run. Emits the CI run
  # id + head SHA so publish-npm can restore that run's build artifact.
  #
  # toolchain-source: workspace, the engine MUST self-host per-job-green from the
  # checked-out commit. bunx-from-registry would deadlock the first release
  # (this release is what publishes @goodvibes-jev/engine) and would make
  # every later release verify itself with the PREVIOUS toolchain version.
  release-verify:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
    needs: [verify-tag-version]
    # Caller permissions must be a superset of what the called workflow's jobs
    # request, or GitHub rejects the whole workflow at startup (jobs: []).
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/reusable-release-verify.yml
    with:
      sha: ${{ needs.verify-tag-version.outputs.sha }}
      workflow: ci.yml
      toolchain-source: workspace
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # A manual dispatch defaults to dry-run. Only an explicit release-mode
  # dispatch or a tag push may reach the publish job below.
  dry-run:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Reject manual non-dry-run release
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "workflow_dispatch releases are dry-run only; push a verified v* tag to publish." >&2
          exit 1
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Release dry run (pack + publish preview, no registry write)
        run: bun run release:dry-run

  publish-npm:
    # Registry publication is an explicit opt-in; native GitHub releases do
    # not require npm credentials or a previously published engine package.
    # Registry writes and latest-tag alignment share one owner across versions.
    concurrency:
      group: engine-npm-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify-tag-version, release-verify]
    if: >-
      always() &&
      vars.PUBLISH_NPM == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')) &&
      needs.verify-tag-version.result == 'success' &&
      needs.release-verify.result == 'success'
    environment:
      name: production
      url: https://www.npmjs.com/package/@goodvibes-jev/engine
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Release-mode dispatch restores + publishes the tag ref (github.ref);
          # a push uses the pushed tag ref. Never the "main" input default here.
          ref: ${{ (github.event.inputs.mode == 'release' && github.ref) || github.event.inputs.ref || github.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Artifact-integrity handoff: restore the exact build the CI run produced
      # for this SHA (not a fresh throwaway build), and assert the run's recorded
      # head SHA equals the tagged SHA before trusting its bytes.
      #
      # Guard FIRST on an empty run id: the per-job-green check-suites fallback
      # can verify green without resolving the Actions run id. An empty run-id
      # fed to download-artifact silently misdirects the download (it stops
      # targeting the CI run), so fail early and honestly instead.
      - name: Require a resolved CI run id for the artifact restore
        env:
          RUN_ID: ${{ needs.release-verify.outputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "release-verify reported green but could not resolve the CI run id (check-suites fallback path)." >&2
            echo "The publish job restores the CI build artifact BY RUN ID; without it the download would" >&2
            echo "misdirect to the current Release run. Re-run this workflow once the Actions API recovers" >&2
            echo "so release-verify resolves the run id, then publish proceeds normally." >&2
            exit 1
          fi
          echo "CI run id resolved: $RUN_ID"
      - name: Assert recorded head SHA matches the tagged SHA
        env:
          RECORDED_SHA: ${{ needs.release-verify.outputs.head_sha }}
          TAGGED_SHA: ${{ github.sha }}
        run: |
          if [ "$RECORDED_SHA" != "$TAGGED_SHA" ]; then
            echo "Artifact integrity check FAILED: CI build head SHA ($RECORDED_SHA) != tagged SHA ($TAGGED_SHA)." >&2
            exit 1
          fi
          echo "Artifact integrity OK: $RECORDED_SHA == $TAGGED_SHA"
      - name: Download CI build artifact (by recorded run id)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-build-output
          path: /tmp/workspace-build-output
          run-id: ${{ needs.release-verify.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore workspace build output
        run: tar -xzf /tmp/workspace-build-output/workspace-build-output.tgz -C .
      # Empty, complete, or a partial at exactly this version (the shape a
      # mid-loop publish failure leaves, which the publish loop's per-package
      # skip converges) all proceed. The stop condition is a published package
      # whose recorded gitHead is a DIFFERENT commit than the one being
      # released. See scripts/verify-published-packages.ts.
      - name: Check the npm registry state for this version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GOODVIBES_RELEASE_SHA: ${{ github.sha }}
        run: bun packages/engine/scripts/verify-published-packages.ts --prepublish-registry-state
      - name: Publish packages (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release:publish:ci
      - name: Verify published packages (propagation poll)
        env:
          GOODVIBES_VERIFY_ATTEMPTS: "48"
          GOODVIBES_VERIFY_DELAY_MS: "5000"
        run: bun run release:verify:published
      # npm publish with no --tag moves `latest` to whatever it just published,
      # so two releases of DIFFERENT versions that overlap leave `latest`
      # pointing backward on every package where the older run landed last.
      # This job serializes publishing and alignment across all versions.
      # Run after propagation so the registry snapshot includes this release.
      - name: Align the latest dist-tag with the highest published version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun packages/engine/scripts/align-dist-tags.ts

  complete-suite-assets:
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release'))
    needs: [verify-tag-version, release-verify]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/suite-release-assets.yml
    with:
      tag: ${{ needs.verify-tag-version.outputs.tag }}

  prepare-native-assets:
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')) &&
      needs.verify-tag-version.result == 'success' &&
      needs.release-verify.result == 'success' &&
      needs.complete-suite-assets.result == 'success'
    needs: [verify-tag-version, release-verify, complete-suite-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Retain release merge tooling
        run: |
          mkdir "$RUNNER_TEMP/release-merge-tooling"
          cp .github/scripts/merge-suite-release-assets.py .github/scripts/release_asset_pins.py .github/scripts/release_asset_sources.py "$RUNNER_TEMP/release-merge-tooling/"
      - name: Checkout released source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.verify-tag-version.outputs.tag }}
          fetch-depth: 0
      - name: Require the verified CI producer
        env:
          RUN_ID: ${{ needs.release-verify.outputs.run_id }}
          RECORDED_SOURCE: ${{ needs.release-verify.outputs.head_sha }}
          SOURCE_SHA: ${{ needs.verify-tag-version.outputs.sha }}
        run: |
          test -n "$RUN_ID"
          test "$RECORDED_SOURCE" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Select the published engine version
        id: version
        env:
          RELEASE_TAG: ${{ needs.verify-tag-version.outputs.tag }}
        run: |
          version=$(bun -e 'console.log(JSON.parse(await Bun.file("packages/engine/package.json").text()).version)')
          test "v$version" = "$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download exact workspace and Agent output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-build-output
          path: /tmp/workspace-build-output
          run-id: ${{ needs.release-verify.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore exact workspace and Agent output
        run: tar -xzf /tmp/workspace-build-output/workspace-build-output.tgz -C .
      - name: Download admitted TUI Linux cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tui-native-linux-x64
          path: /tmp/native-release-downloads/tui-native-linux-x64
          run-id: ${{ needs.release-verify.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download admitted Daemon Linux x64 cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-native-linux-x64
          path: /tmp/native-release-downloads/daemon-native-linux-x64
          run-id: ${{ needs.release-verify.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download admitted Daemon Linux ARM cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-native-linux-arm64
          path: /tmp/native-release-downloads/daemon-native-linux-arm64
          run-id: ${{ needs.release-verify.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download admitted Daemon Darwin x64 cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-native-darwin-x64
          path: /tmp/native-release-downloads/daemon-native-darwin-x64
          run-id: ${{ needs.release-verify.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download admitted Daemon Darwin ARM cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-native-darwin-arm64
          path: /tmp/native-release-downloads/daemon-native-darwin-arm64
          run-id: ${{ needs.release-verify.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and stage admitted native release assets
        env:
          CI_RUN_ID: ${{ needs.release-verify.outputs.run_id }}
          SOURCE_SHA: ${{ needs.verify-tag-version.outputs.sha }}
        run: bun .github/scripts/stage-native-release-assets.mjs "$SOURCE_SHA" "$CI_RUN_ID" /tmp/native-release-downloads /tmp/native-release-assets
      - name: Download complete installer assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: installer-release-assets
          path: /tmp/installer-release-assets
      - name: Complete the admitted native release
        env:
          RELEASE_TAG: ${{ needs.verify-tag-version.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify-tag-version.outputs.sha }}
        run: |
          # CI-admitted bytes win collisions; all selected reader/companion
          # pins must match those actual bytes before adding any missing files.
          python3 "$RUNNER_TEMP/release-merge-tooling/merge-suite-release-assets.py" /tmp/native-release-assets /tmp/installer-release-assets "$RELEASE_TAG" "$SOURCE_SHA"
      - name: Upload admitted native release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release-assets
          path: /tmp/native-release-assets/*
          retention-days: 7
          if-no-files-found: error

  github-release:
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')) &&
      (needs.publish-npm.result == 'success' ||
       (vars.PUBLISH_NPM != 'true' && needs.publish-npm.result == 'skipped')) &&
      needs.prepare-native-assets.result == 'success'
    needs: [verify-tag-version, publish-npm, prepare-native-assets]
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-gh-release.yml
    with:
      tag: ${{ needs.verify-tag-version.outputs.tag }}
      artifact-name: native-release-assets
      assets-glob: dist/*
      changelog-path: packages/engine/CHANGELOG.md
      toolchain-source: workspace

  published-install-acceptance:
    needs: [verify-tag-version, github-release]
    if: needs.github-release.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-published-install-acceptance.yml
    with:
      tag: ${{ needs.verify-tag-version.outputs.tag }}
      source: ${{ needs.verify-tag-version.outputs.sha }}
      tooling-sha: ${{ github.sha }}
