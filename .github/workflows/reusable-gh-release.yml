name: Reusable GitHub release

# Reusable: GitHub Release (notes-file or changelog excerpt + SHA256SUMS + assets)
#
# Consumer contract
#   Creates a GitHub Release for a tag from a CI artifact that holds the payloads
#   and the SHA256SUMS.txt written when they were collected. The release body is
#   an optional per-release notes file, otherwise the tag's CHANGELOG section.
#   Before upload the manifest is verified to list exactly the payloads with
#   their bytes. An existing release instead fills only missing assets after
#   validating metadata against the original published bytes; reruns never
#   replace an existing program. Asset selection and the release lookup are
#   functions of .github/scripts/release_asset_pins.py, covered by its tests.
#
#   Call it from a workflow in THIS repository only. The job checks out the
#   caller's repository and runs `./.github/actions/bun` and
#   `.github/scripts/*` from that checkout, so a caller in another repository
#   fails at the first local action with a not-found error.
#     jobs:
#       gh-release:
#         uses: ./.github/workflows/reusable-gh-release.yml
#         with:
#           tag: ${{ github.ref_name }}
#           artifact-name: installer-release-assets
#           assets-glob: "dist/*"
#           notes-file: "docs/releases/{version}.md"   # optional prose override
#
#   The called copy is the one at the caller's own commit, so a release always
#   runs the scripts that were reviewed with it.
#
#   Inputs:  tag (required), artifact-name (a CI artifact to download into
#            dist/, optional), assets-glob (payload files to upload; the
#            manifest beside them is excluded), notes-file (optional
#            release-body override; `{version}` expands to the tag without its
#            v prefix: when set AND the file exists at the checked-out ref its
#            content is the body, otherwise the changelog excerpt is used),
#            changelog-path (default CHANGELOG.md).
#
#   assets-glob accepts whitespace-separated globs: spaces or newlines.
#   Runs on ubuntu-24.04 so awk changelog extraction stays GNU-stable.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      artifact-name:
        description: Optional CI artifact to download into ./dist before staging.
        required: false
        type: string
        default: ""
      assets-glob:
        description: Whitespace-separated globs (spaces or newlines, relative to
          repo root) of the payloads to upload. The SHA256SUMS.txt beside them
          is verified and uploaded as the manifest, never as a payload.
        required: true
        type: string
      notes-file:
        description: Optional release-body override. `{version}` expands to the
          tag without its v prefix. When set and the file exists at the
          checked-out ref, its content is the release body; otherwise the
          changelog excerpt is used.
        required: false
        type: string
        default: ""
      changelog-path:
        required: false
        type: string
        default: CHANGELOG.md

permissions:
  contents: read

jobs:
  gh-release:
    concurrency:
      group: native-release-publication-${{ inputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Setup Bun
        uses: ./.github/actions/bun
      - name: Download release artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: dist
      - name: Resolve release notes (notes-file override, else changelog excerpt)
        id: changelog
        env:
          VERSION: ${{ inputs.tag }}
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          NOTES_FILE: ${{ inputs.notes-file }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          # Precedence: a per-release notes file (e.g. docs/releases/<version>.md
          # prose) wins over the changelog excerpt when configured AND present
          # at the checked-out ref; otherwise fall back to the excerpt.
          notes_path="${NOTES_FILE//\{version\}/$version}"
          if [ -n "$notes_path" ] && [ -f "$notes_path" ]; then
            echo "Release body: notes file $notes_path"
            cp "$notes_path" /tmp/release_notes.md
          else
            if [ -n "$notes_path" ]; then
              echo "Notes file $notes_path not found at this ref, falling back to the changelog excerpt."
            fi
            # A bare `-` in the terminator class made `## [2.0.1-rc.1]` match a
            # 2.0.1 cut, concatenating the RC section into the release body.
            # Kept byte-identical to release.yml's pattern.
            excerpt="$(awk -v version="$version" '
              $0 ~ "^## (\\[)?" version "(\\])?([[:space:]]|$)" { in_section = 1; next }
              in_section && /^## / { exit }
              in_section { print }
            ' "$CHANGELOG_PATH")"
            if [ -z "$excerpt" ]; then
              # Non-fatal (the changelog gate owns the hard refusal) but never
              # silent: a one-line body means no section matched.
              echo "::warning::No ${CHANGELOG_PATH} section matched ${version}; falling back to a bare 'Release ${version}' body."
              excerpt="Release ${version}"
            fi
            printf '%s\n' "$excerpt" > /tmp/release_notes.md
          fi
          echo "body=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"
      - name: Select the payloads (the manifest beside them is not one)
        id: payloads
        env:
          ASSET_GLOBS: ${{ inputs.assets-glob }}
        run: python3 .github/scripts/release_asset_pins.py payloads "$ASSET_GLOBS"
      - name: Inspect existing release without treating API failures as absence
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/release_asset_pins.py release-exists "$RELEASE_TAG"
      - name: Complete an existing release without replacing published payloads
        if: steps.publication.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PAYLOAD_PATHS: ${{ steps.payloads.outputs.paths }}
        run: |
          set -euo pipefail
          completion="$RUNNER_TEMP/native-release-completion"
          python3 .github/scripts/release_asset_pins.py stage "$completion" "$PAYLOAD_PATHS"
          python3 .github/scripts/publish-missing-suite-assets.py "$completion" "$RELEASE_TAG"
      - name: Verify the collected checksum manifest against the payloads
        id: checksums
        if: steps.publication.outputs.exists == 'false'
        env:
          PAYLOAD_PATHS: ${{ steps.payloads.outputs.paths }}
        run: |
          set -euo pipefail
          mapfile -t assets <<< "$PAYLOAD_PATHS"
          # The manifest was written from the digests verified at collection; it must list exactly these payloads.
          bun packages/engine/toolchain/src/bin/sha256sums.ts --verify dist/SHA256SUMS.txt --exact "${assets[@]}"
          echo "path=dist/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        if: steps.publication.outputs.exists == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: ${{ steps.changelog.outputs.body }}
          # Created as a draft so `releases/latest` does not name this tag while its payloads and checksum
          # manifest are still uploading; the next step publishes it once every file is attached.
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            ${{ steps.payloads.outputs.paths }}
            ${{ steps.checksums.outputs.path }}
      - name: Publish the release once its payloads are attached
        if: steps.publication.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The installer and every daemon's update check follow `releases/latest`, so the mark is set
          # here, never left to GitHub's default (which gives it to whatever was published last): it goes
          # to this tag only when the tag is a stable vN.N.N at least as high as every published stable
          # suite release, the rule align-dist-tags.ts applies to npm. A patch for an older line or a
          # prerelease is published without it.
          latest=false
          if printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            highest="$({ gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
              --json tagName --jq '.[].tagName'; printf '%s\n' "$RELEASE_TAG"; } \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            [ "$highest" = "$RELEASE_TAG" ] && latest=true
          fi
          echo "Latest mark for $RELEASE_TAG: $latest"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
