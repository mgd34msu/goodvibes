name: Reusable GitHub release

# Reusable: GitHub Release (notes-file or changelog excerpt + SHA256SUMS + assets)
#
# Consumer contract
#   Creates a GitHub Release for a tag: resolves the release body (an optional
#   per-release notes file wins; otherwise the tag's CHANGELOG section is
#   extracted), generates a SHA256SUMS manifest over the staged assets via the
#   toolchain `sha256sums` CLI (a missing asset is fatal), and uploads the
#   assets with a pinned softprops/action-gh-release. An existing release instead
#   fills only missing assets after validating metadata against the original
#   published bytes; reruns never replace an existing program. One copy,
#   parameterized by the asset manifest.
#
#   Call it:
#     jobs:
#       gh-release:
#         uses: mgd34msu/goodvibes/.github/workflows/reusable-gh-release.yml@<commit-sha>
#         with:
#           tag: ${{ github.ref_name }}
#           artifact-name: release-assets
#           assets-glob: "dist/goodvibes-*"
#           notes-file: "docs/releases/{version}.md"   # optional prose override
#
#   Pin `<commit-sha>` to a full commit SHA, never `@main`; note alongside the
#   pin which GoodVibes version it corresponds to. Bumping the pin is a
#   deliberate, reviewed change (its own commit/PR), not an automatic float
#   onto whatever main has become.
#
#   Inputs:  tag (required), artifact-name (a CI artifact to download into
#            dist/, optional), assets-glob (files to hash + upload), notes-file
#            (optional release-body override; `{version}` expands to the tag
#            without its v prefix: when set AND the file exists at the
#            checked-out ref its content is the body, otherwise the changelog
#            excerpt is used exactly as before), changelog-path (default
#            CHANGELOG.md), sha256-name (default SHA256SUMS.txt), bun-version.
#
#   assets-glob accepts whitespace-separated globs: spaces or newlines. The
#   value is normalized to newline-separated form before it reaches the
#   softprops `files` sink (which splits on newlines only), so both forms
#   behave identically.
#   Runs on ubuntu-24.04 so awk changelog extraction stays GNU-stable.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      artifact-name:
        description: Optional CI artifact to download into ./dist before staging.
        required: false
        type: string
        default: ""
      assets-glob:
        description: Whitespace-separated globs (spaces or newlines, relative to
          repo root) of assets to checksum + upload. Normalized to
          newline-separated form before use, so both separators work.
        required: true
        type: string
      use-existing-checksums:
        description: Verify and publish the exact staged 64-payload checksum manifest without regenerating it.
        required: false
        type: boolean
        default: false
      notes-file:
        description: Optional release-body override. `{version}` expands to the
          tag without its v prefix. When set and the file exists at the
          checked-out ref, its content is the release body; otherwise the
          changelog excerpt is used.
        required: false
        type: string
        default: ""
      changelog-path:
        required: false
        type: string
        default: CHANGELOG.md
      sha256-name:
        required: false
        type: string
        default: SHA256SUMS.txt
      bun-version:
        required: false
        type: string
        default: "1.3.14"
      toolchain-spec:
        required: false
        type: string
        default: "@goodvibes-jev/engine"
      toolchain-source:
        description: Use the checked-out workspace or a published toolchain for checksums.
        required: false
        type: string
        default: registry

permissions:
  contents: read

jobs:
  gh-release:
    concurrency:
      group: native-release-publication-${{ inputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Download release artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name }}
          path: dist
      - name: Resolve release notes (notes-file override, else changelog excerpt)
        id: changelog
        env:
          VERSION: ${{ inputs.tag }}
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          NOTES_FILE: ${{ inputs.notes-file }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          # Precedence: a per-release notes file (e.g. docs/releases/<version>.md
          # prose) wins over the changelog excerpt when configured AND present
          # at the checked-out ref; otherwise fall back to the excerpt.
          notes_path="${NOTES_FILE//\{version\}/$version}"
          if [ -n "$notes_path" ] && [ -f "$notes_path" ]; then
            echo "Release body: notes file $notes_path"
            cp "$notes_path" /tmp/release_notes.md
          else
            if [ -n "$notes_path" ]; then
              echo "Notes file $notes_path not found at this ref, falling back to the changelog excerpt."
            fi
            # A bare `-` in the terminator class made `## [2.0.1-rc.1]` match a
            # 2.0.1 cut, concatenating the RC section into the release body.
            # Kept byte-identical to release.yml's pattern.
            excerpt="$(awk -v version="$version" '
              $0 ~ "^## (\\[)?" version "(\\])?([[:space:]]|$)" { in_section = 1; next }
              in_section && /^## / { exit }
              in_section { print }
            ' "$CHANGELOG_PATH")"
            if [ -z "$excerpt" ]; then
              # Non-fatal (the changelog gate owns the hard refusal) but never
              # silent: a one-line body means no section matched.
              echo "::warning::No ${CHANGELOG_PATH} section matched ${version}; falling back to a bare 'Release ${version}' body."
              excerpt="Release ${version}"
            fi
            printf '%s\n' "$excerpt" > /tmp/release_notes.md
          fi
          echo "body=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"
      - name: Normalize asset globs (spaces -> newlines)
        id: globs
        env:
          RAW_GLOBS: ${{ inputs.assets-glob }}
        run: |
          set -euo pipefail
          # softprops/action-gh-release `files` splits on NEWLINES only; accept
          # space-separated values too by normalizing all whitespace runs.
          {
            echo 'paths<<GOODVIBES_GLOBS_EOF'
            tr -s ' \t' '\n' <<< "$RAW_GLOBS" | sed '/^$/d'
            echo 'GOODVIBES_GLOBS_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Resolve payload paths excluding the checksum manifest
        id: payloads
        env:
          NORMALIZED_GLOBS: ${{ steps.globs.outputs.paths }}
          SHA256_NAME: ${{ inputs.sha256-name }}
        run: |
          python3 - <<'PY_PAYLOADS'
          import glob, os, re
          from pathlib import Path
          checksum = os.environ['SHA256_NAME']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+', checksum), 'Checksum name must be flat'
          selected = {}
          for pattern in os.environ['NORMALIZED_GLOBS'].split():
              matches = glob.glob(pattern)
              assert matches, f'No asset matched: {pattern}'
              for value in matches:
                  path = Path(value)
                  assert path.is_file() and not path.is_symlink(), f'Invalid release asset: {path}'
                  if path.name == checksum:
                      continue
                  assert re.fullmatch(r'[A-Za-z0-9_.-]+', path.name), f'Invalid release name: {path}'
                  prior = selected.get(path.name)
                  assert prior is None or prior.resolve() == path.resolve(), f'Ambiguous release basename: {path.name}'
                  selected[path.name] = path
          assert selected, 'No payload assets selected'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('paths<<GOODVIBES_PAYLOADS_EOF\n')
              output.write(''.join(str(selected[name]) + '\n' for name in sorted(selected)))
              output.write('GOODVIBES_PAYLOADS_EOF\n')
          PY_PAYLOADS
      - name: Inspect existing release without treating API failures as absence
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY_RELEASE'
          import json, os, re, subprocess
          tag, repo = os.environ['RELEASE_TAG'], os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?', tag)
          result = subprocess.run(['gh', 'api', f'repos/{repo}/releases/tags/{tag}'], capture_output=True, text=True)
          value = json.loads(result.stdout)
          if result.returncode:
              assert str(value.get('status')) == '404', 'Release lookup failed; refusing to assume a fresh release'
              exists = False
          else:
              assert value['tag_name'] == tag and not value['draft'], 'Unexpected release state'
              exists = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('exists=' + str(exists).lower() + '\n')
          PY_RELEASE
      - name: Complete an existing release without replacing published payloads
        if: steps.publication.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          NORMALIZED_GLOBS: ${{ steps.payloads.outputs.paths }}
          SHA256_NAME: ${{ inputs.sha256-name }}
        run: |
          set -euo pipefail
          export COMPLETION_DIR="$RUNNER_TEMP/native-release-completion"
          python3 - <<'PY_STAGE'
          import os, sys
          sys.path.insert(0, '.github/scripts')
          from release_asset_pins import stage_release_assets
          stage_release_assets(os.environ['COMPLETION_DIR'], os.environ['NORMALIZED_GLOBS'], os.environ['SHA256_NAME'])
          PY_STAGE
          python3 .github/scripts/publish-missing-suite-assets.py "$COMPLETION_DIR" "$RELEASE_TAG" "$SHA256_NAME"
      - name: Generate or verify the consumer checksum manifest
        id: checksums
        if: steps.publication.outputs.exists == 'false'
        env:
          PAYLOAD_PATHS: ${{ steps.payloads.outputs.paths }}
          TOOLCHAIN_SPEC: ${{ inputs.toolchain-spec }}
          TOOLCHAIN_SOURCE: ${{ inputs.toolchain-source }}
          SHA256_NAME: ${{ inputs.sha256-name }}
          USE_EXISTING_CHECKSUMS: ${{ inputs.use-existing-checksums }}
        run: |
          set -euo pipefail
          mapfile -t assets <<< "$PAYLOAD_PATHS"
          if [ "$USE_EXISTING_CHECKSUMS" = true ]; then
            if [ "$TOOLCHAIN_SOURCE" != workspace ]; then
              echo "Existing checksum verification requires the workspace toolchain" >&2
              exit 1
            fi
            # The acceptance artifact contains this exact manifest beside its
            # 64 payloads. Validate its complete name set before the source CLI
            # consumes its expected pins; never hash a new publication manifest.
            CHECKSUM_PATH="dist/$SHA256_NAME"
            export CHECKSUM_PATH
            python3 - <<'PY_CHECKSUMS'
          import os, re
          from pathlib import Path
          paths = [Path(value) for value in os.environ['PAYLOAD_PATHS'].splitlines()]
          manifest = Path(os.environ['CHECKSUM_PATH'])
          assert manifest.is_file() and not manifest.is_symlink(), 'Staged checksum manifest is missing'
          assert len(paths) == 64 and all(path.parent == manifest.parent for path in paths), 'Expected exactly 64 staged payloads beside the manifest'
          names = []
          for line in manifest.read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9_.-]+)', line)
              assert match and match[2] != manifest.name, 'Invalid staged checksum entry'
              names.append(match[2])
          assert len(names) == 64 and len(set(names)) == 64 and set(names) == {path.name for path in paths}, 'Staged checksum names must exactly cover all 64 payloads'
          PY_CHECKSUMS
            bun packages/engine/toolchain/src/bin/sha256sums.ts --verify "$CHECKSUM_PATH"
          else
            CHECKSUM_PATH="$SHA256_NAME"
            if [ "$TOOLCHAIN_SOURCE" = workspace ]; then
              bun packages/engine/toolchain/src/bin/sha256sums.ts --out "$CHECKSUM_PATH" "${assets[@]}"
            elif [ "$TOOLCHAIN_SOURCE" = registry ]; then
              bunx --package "$TOOLCHAIN_SPEC" goodvibes-sha256sums --out "$CHECKSUM_PATH" "${assets[@]}"
            else
              echo "Unknown checksum toolchain source" >&2
              exit 1
            fi
          fi
          echo "path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        if: steps.publication.outputs.exists == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: ${{ steps.changelog.outputs.body }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            ${{ steps.payloads.outputs.paths }}
            ${{ steps.checksums.outputs.path }}
