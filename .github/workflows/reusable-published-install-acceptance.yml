name: Reusable published native install acceptance

on:
  # Recheck already-published bytes without rebuilding or uploading payloads.
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to install and verify.
        required: true
        type: string
      source:
        description: Full original payload commit recorded by the published readers.
        required: true
        type: string
      previous-tag:
        description: Published previous suite tag for genuine automatic upgrade and complete-cohort rollback.
        required: false
        type: string
        default: ""
      previous-source:
        description: Full original previous payload commit recorded by its published readers.
        required: false
        type: string
        default: ""
      tooling-sha:
        description: Full commit containing the acceptance tooling to run.
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source:
        description: Original released payload commit, not the acceptance tooling commit.
        required: true
        type: string
      previous-tag:
        description: Published previous suite tag for genuine automatic upgrade and complete-cohort rollback.
        required: false
        type: string
        default: ""
      previous-source:
        description: Full original previous payload commit recorded by its published readers.
        required: false
        type: string
        default: ""
      tooling-sha:
        description: Immutable caller commit containing the current acceptance entrypoint.
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-install:
    # Only original disposable hosted accounts, never a local/persistent service.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Verify the original acceptance tooling
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          test -f scripts/accept-published-suite.mjs
      - name: Download, install, serve and uninstall the published suite
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/accept-published-suite.mjs "$RELEASE_TAG" "$RELEASE_SOURCE" "$RELEASE_TARGET"
      - name: Preserve bounded native acceptance result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-install-${{ matrix.target }}
          path: ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
          if-no-files-found: warn
          retention-days: 7

  historical-linux-upgrade:
    # The published v3.1.1 unattended updater supports Linux only. These are
    # separate fresh accounts; native-install's four fresh-install lanes remain.
    if: inputs.tag == 'v3.1.2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Verify the original released payload source
        env:
          PAYLOAD_SOURCE: ${{ inputs.source }}
        run: test "$(git rev-parse HEAD)" = "$PAYLOAD_SOURCE"
      - name: Build only the source-bound rollback verifier
        # Never copy these outputs into the installed suite. Installation and
        # automatic delivery must use independently verified public assets.
        run: |
          bun install --frozen-lockfile
          bun packages/engine/scripts/build.ts
      - name: Observe actual old unattended upgrade and unsupported rollback refusal
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/accept-published-suite.mjs "$RELEASE_TAG" "$RELEASE_SOURCE" "$RELEASE_TARGET" upgrade-v3.1.1
      - name: Preserve bounded historical delivery result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-upgrade-v3.1.1-${{ matrix.target }}
          path: ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
          if-no-files-found: warn
          retention-days: 7

  previous-release-upgrade:
    # Four original hosted accounts exercise the real previous published suite.
    # The original v3.1.1 historical job remains a separate evidence path.
    if: inputs.tag != 'v3.1.2' || inputs.previous-tag != '' || inputs.previous-source != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout current acceptance tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
          fetch-depth: 0
      - name: Checkout the exact candidate payload source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source }}
          path: candidate-source
      - name: Verify both source owners and the previous published identity
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          SOURCE_SHA: ${{ inputs.source }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous-source }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          test "$PREVIOUS_TAG" != "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          test "$(git -C candidate-source rev-parse HEAD)" = "$SOURCE_SHA"
          test -f scripts/accept-published-suite.mjs
          test -f candidate-source/packages/engine/platform/src/platform/daemon/lifecycle-marker.ts
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Setup Bun for the original source lifecycle writer
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install source lifecycle writer dependencies
        working-directory: candidate-source
        run: bun install --frozen-lockfile
      - name: Observe previous-suite automatic upgrade and complete-cohort rollback
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous-source }}
          CANDIDATE_SOURCE_ROOT: ${{ github.workspace }}/candidate-source
        run: node scripts/accept-published-suite.mjs "$RELEASE_TAG" "$RELEASE_SOURCE" "$RELEASE_TARGET" upgrade-previous "$PREVIOUS_TAG" "$PREVIOUS_SOURCE"
      - name: Preserve bounded automatic upgrade and rollback result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-upgrade-previous-${{ matrix.target }}
          path: ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
          if-no-files-found: warn
          retention-days: 7
