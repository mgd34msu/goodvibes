name: Reusable staged native install acceptance

on:
  # Exercise the admitted private artifact before public promotion.
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate release tag to install and verify.
        required: true
        type: string
      source:
        description: Full payload commit recorded by the candidate readers.
        required: true
        type: string
      artifact-run-id:
        description: Run containing the exact installer-release-assets artifact (payloads and their SHA256SUMS.txt).
        required: true
        type: string
      previous-tag:
        description: Published previous suite tag for genuine automatic upgrade and complete-cohort rollback.
        required: false
        type: string
        default: ""
      previous-source:
        description: Full original previous payload commit recorded by its published readers.
        required: false
        type: string
        default: ""
      tooling-sha:
        description: Full commit containing the acceptance tooling to run.
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source:
        description: Original released payload commit, not the acceptance tooling commit.
        required: true
        type: string
      artifact-run-id:
        description: Run containing the exact installer-release-assets artifact (payloads and their SHA256SUMS.txt).
        required: true
        type: string
      previous-tag:
        description: Published previous suite tag for genuine automatic upgrade and complete-cohort rollback.
        required: false
        type: string
        default: ""
      previous-source:
        description: Full original previous payload commit recorded by its published readers.
        required: false
        type: string
        default: ""
      tooling-sha:
        description: Immutable caller commit containing the current acceptance entrypoint.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  native-install:
    # Only original disposable hosted accounts, never a local/persistent service.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling-sha }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Verify the original acceptance tooling and the release identity
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          SOURCE_SHA: ${{ inputs.source }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          test -f scripts/accept-staged-suite.mjs
      - name: Download the exact collected release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-release-assets
          path: ${{ runner.temp }}/staged-release-assets
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install, serve and uninstall the staged suite
        env:
          GOODVIBES_ACCEPTANCE_METADATA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/accept-staged-suite.mjs "$RELEASE_TAG" "$RELEASE_SOURCE" "$RELEASE_TARGET" "$RUNNER_TEMP/staged-release-assets"
      - name: Preserve bounded native acceptance result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-install-${{ matrix.target }}
          path: ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
          if-no-files-found: warn
          retention-days: 7

  previous-release-floor:
    # The upgrade check runs only when the release being published is 3.4.0 or later; 3.3.x patch releases skip it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      run: ${{ steps.floor.outputs.run }}
    steps:
      - name: Decide whether this release runs the previous-release upgrade check
        id: floor
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous-source }}
        run: |
          set -euo pipefail
          run=true
          if [ -z "$PREVIOUS_TAG" ] && [ -z "$PREVIOUS_SOURCE" ]; then
            run=false
          elif [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]}
            if [ "$major" -lt 3 ] || { [ "$major" -eq 3 ] && [ "$minor" -lt 4 ]; }; then
              run=false
              echo "::notice::$RELEASE_TAG is older than v3.4.0; the previous-release upgrade check is not run."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  previous-release-upgrade:
    # Four original hosted accounts exercise the real previous published suite.
    # A release with no earlier version tag has nothing to upgrade from.
    # Either input alone still runs the job so its identity check refuses a partial pair; only both empty (a first release) skips.
    needs: previous-release-floor
    if: needs.previous-release-floor.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout current acceptance tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling-sha }}
          fetch-depth: 0
      - name: Checkout the exact candidate payload source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          path: candidate-source
      - name: Verify both source owners and the previous published identity
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          SOURCE_SHA: ${{ inputs.source }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous-source }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS_TAG" ] || [ -z "$PREVIOUS_SOURCE" ]; then
            echo "::error::The previous release is named only in part (tag '$PREVIOUS_TAG', source '$PREVIOUS_SOURCE'); the upgrade check needs both. Fix the previous-release resolver output and rerun."
            exit 1
          fi
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$PREVIOUS_TAG" != "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          test "$(git -C candidate-source rev-parse HEAD)" = "$SOURCE_SHA"
          test -f scripts/accept-staged-suite.mjs
          test -f candidate-source/packages/engine/platform/src/platform/daemon/lifecycle-marker.ts
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Setup Bun for the original source lifecycle writer
        uses: ./.github/actions/bun
      - name: Download the exact collected release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-release-assets
          path: ${{ runner.temp }}/staged-release-assets
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install source lifecycle writer dependencies
        working-directory: candidate-source
        run: bun install --frozen-lockfile
      - name: Observe previous-suite automatic upgrade and complete-cohort rollback
        env:
          GOODVIBES_ACCEPTANCE_METADATA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous-source }}
          CANDIDATE_SOURCE_ROOT: ${{ github.workspace }}/candidate-source
        run: node scripts/accept-staged-suite.mjs "$RELEASE_TAG" "$RELEASE_SOURCE" "$RELEASE_TARGET" "$RUNNER_TEMP/staged-release-assets" upgrade-previous "$PREVIOUS_TAG" "$PREVIOUS_SOURCE"
      - name: Preserve bounded automatic upgrade and rollback result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-upgrade-previous-${{ matrix.target }}
          path: ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
          if-no-files-found: warn
          retention-days: 7
