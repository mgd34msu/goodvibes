name: Reusable staged native install acceptance

on:
  # Exercise the admitted private artifact before public promotion.
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate release tag to install and verify.
        required: true
        type: string
      source:
        description: Full payload commit recorded by the candidate readers.
        required: true
        type: string
      artifact-run-id:
        description: Run containing the exact native-release-assets artifact to stage.
        required: true
        type: string
      previous-tag:
        description: Published previous suite tag for genuine automatic upgrade and complete-cohort rollback.
        required: false
        type: string
        default: ""
      previous-source:
        description: Full original previous payload commit recorded by its published readers.
        required: false
        type: string
        default: ""
      tooling-sha:
        description: Full commit containing the acceptance tooling to run.
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source:
        description: Original released payload commit, not the acceptance tooling commit.
        required: true
        type: string
      artifact-run-id:
        description: Run containing the exact native-release-assets artifact to stage.
        required: true
        type: string
      previous-tag:
        description: Published previous suite tag for genuine automatic upgrade and complete-cohort rollback.
        required: false
        type: string
        default: ""
      previous-source:
        description: Full original previous payload commit recorded by its published readers.
        required: false
        type: string
        default: ""
      tooling-sha:
        description: Immutable caller commit containing the current acceptance entrypoint.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  stage-release-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
          fetch-depth: 0
      - name: Verify immutable staging inputs
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          SOURCE_SHA: ${{ inputs.source }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Download the exact admitted native artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-release-assets
          path: ${{ runner.temp }}/staged-release-assets
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage the single consumer checksum manifest
        env:
          ASSETS_DIRECTORY: ${{ runner.temp }}/staged-release-assets
        run: |
          set -euo pipefail
          python3 - <<'PY_ASSETS'
          import os, re
          from pathlib import Path
          assets = list(Path(os.environ['ASSETS_DIRECTORY']).iterdir())
          assert len(assets) == 64, 'The admitted native release must contain exactly 64 payloads'
          assert all(path.is_file() and not path.is_symlink() and re.fullmatch(r'[A-Za-z0-9_.-]+', path.name) and path.name != 'SHA256SUMS.txt' for path in assets), 'Invalid native release member'
          PY_ASSETS
          bun packages/engine/toolchain/src/bin/sha256sums.ts --out "$ASSETS_DIRECTORY/SHA256SUMS.txt" "$ASSETS_DIRECTORY"/*
      - name: Retain the exact artifact accepted and promoted
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-release-assets
          path: ${{ runner.temp }}/staged-release-assets/*
          if-no-files-found: error
          retention-days: 7

  native-install:
    needs: [stage-release-assets]
    # Only original disposable hosted accounts, never a local/persistent service.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Verify the original acceptance tooling
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          test -f scripts/accept-staged-suite.mjs
      - name: Download the staged artifact from this acceptance run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staged-release-assets
          path: ${{ runner.temp }}/staged-release-assets
      - name: Install, serve and uninstall the staged suite
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/accept-staged-suite.mjs "$RELEASE_TAG" "$RELEASE_SOURCE" "$RELEASE_TARGET" "$RUNNER_TEMP/staged-release-assets"
      - name: Preserve bounded native acceptance result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-install-${{ matrix.target }}
          path: ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
          if-no-files-found: warn
          retention-days: 7

  historical-linux-upgrade:
    needs: [stage-release-assets]
    # The published v3.1.1 unattended updater supports Linux only. These are
    # separate fresh accounts; native-install's four fresh-install lanes remain.
    if: inputs.tag == 'v3.1.2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source }}
          path: candidate-source
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Verify current tooling and original payload source separately
        env:
          PAYLOAD_SOURCE: ${{ inputs.source }}
          TOOLING_SHA: ${{ inputs.tooling-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          test "$(git -C candidate-source rev-parse HEAD)" = "$PAYLOAD_SOURCE"
          test -f scripts/accept-staged-suite.mjs
      - name: Build only the source-bound rollback verifier
        # These JS outputs only support rollback verification. Installed
        # programs and automatic delivery use the staged native artifact.
        working-directory: candidate-source
        run: |
          bun install --frozen-lockfile
          bun packages/engine/scripts/build.ts
      - name: Download the staged artifact from this acceptance run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staged-release-assets
          path: ${{ runner.temp }}/staged-release-assets
      - name: Observe actual old unattended upgrade and unsupported rollback refusal
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
          CANDIDATE_SOURCE_ROOT: ${{ github.workspace }}/candidate-source
        run: node scripts/accept-staged-suite.mjs "$RELEASE_TAG" "$RELEASE_SOURCE" "$RELEASE_TARGET" "$RUNNER_TEMP/staged-release-assets" upgrade-v3.1.1
      - name: Preserve bounded historical delivery result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-upgrade-v3.1.1-${{ matrix.target }}
          path: ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
          if-no-files-found: warn
          retention-days: 7

  previous-release-upgrade:
    needs: [stage-release-assets]
    # Four original hosted accounts exercise the real previous published suite.
    # The original v3.1.1 historical job remains a separate evidence path.
    if: inputs.tag != 'v3.1.2' || inputs.previous-tag != '' || inputs.previous-source != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout current acceptance tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
          fetch-depth: 0
      - name: Checkout the exact candidate payload source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source }}
          path: candidate-source
      - name: Verify both source owners and the previous published identity
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          SOURCE_SHA: ${{ inputs.source }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous-source }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          test "$PREVIOUS_TAG" != "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          test "$(git -C candidate-source rev-parse HEAD)" = "$SOURCE_SHA"
          test -f scripts/accept-staged-suite.mjs
          test -f candidate-source/packages/engine/platform/src/platform/daemon/lifecycle-marker.ts
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Setup Bun for the original source lifecycle writer
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Download the staged artifact from this acceptance run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staged-release-assets
          path: ${{ runner.temp }}/staged-release-assets
      - name: Install source lifecycle writer dependencies
        working-directory: candidate-source
        run: bun install --frozen-lockfile
      - name: Observe previous-suite automatic upgrade and complete-cohort rollback
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous-source }}
          CANDIDATE_SOURCE_ROOT: ${{ github.workspace }}/candidate-source
        run: node scripts/accept-staged-suite.mjs "$RELEASE_TAG" "$RELEASE_SOURCE" "$RELEASE_TARGET" "$RUNNER_TEMP/staged-release-assets" upgrade-previous "$PREVIOUS_TAG" "$PREVIOUS_SOURCE"
      - name: Preserve bounded automatic upgrade and rollback result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-upgrade-previous-${{ matrix.target }}
          path: ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
          if-no-files-found: warn
          retention-days: 7
