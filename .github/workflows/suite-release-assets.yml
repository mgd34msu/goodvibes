name: Complete suite release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to complete without replacing its published binaries
        required: true
      candidate-source:
        description: Full candidate commit; requires publish_existing=false and never resolves or creates a tag.
        type: string
        required: false
        default: ""
      publish_existing:
        description: Add missing files to the existing release
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      candidate-source:
        description: Full candidate commit; requires publish_existing=false and never resolves or creates a tag.
        type: string
        required: false
        default: ""
      publish_existing:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: suite-release-assets-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Retain packaging tooling
        run: |
          cp .github/scripts/package-suite-release.mjs "$RUNNER_TEMP/package-suite-release.mjs"
          cp products/daemon/scripts/build-native-ci.ts "$RUNNER_TEMP/build-native-ci.ts"
          cp products/daemon/scripts/native-execution-process.mjs "$RUNNER_TEMP/native-execution-process.mjs"
      - name: Require a nonpublishing immutable candidate
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate-source }}
          PUBLISH_EXISTING: ${{ inputs.publish_existing }}
        run: |
          if [ -n "$CANDIDATE_SOURCE" ]; then
            [[ "$CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            test "$PUBLISH_EXISTING" = false
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate-source || inputs.tag }}
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Build publisher tooling and engine
        run: bun packages/engine/scripts/build.ts
      - name: Package and execute native release binaries
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          bun "$RUNNER_TEMP/package-suite-release.mjs" "$TARGET" "$RUNNER_TEMP/release-assets" "$RELEASE_TAG"
          tar -czf "$RUNNER_TEMP/suite-$TARGET.tgz" -C "$RUNNER_TEMP/release-assets" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-release-${{ matrix.target }}
          path: ${{ runner.temp }}/suite-${{ matrix.target }}.tgz
          retention-days: 7
          if-no-files-found: error
  collect:
    concurrency:
      group: native-release-publication-${{ inputs.tag }}
      cancel-in-progress: false
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suite-release-*
          path: ${{ runner.temp }}/suite-archives
      # Every member is checked against its packager digest once, here; SHA256SUMS.txt is written from those digests
      # and travels with the payloads to installation acceptance and the release job.
      - name: Admit complete same-source suite and write its checksum manifest
        id: admit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SOURCE: ${{ inputs.candidate-source }}
        run: |
          if [ -n "$CANDIDATE_SOURCE" ]; then
            python3 .github/scripts/collect-suite-release.py "$RUNNER_TEMP/suite-archives" "$RUNNER_TEMP/suite-assets" "$RELEASE_TAG" "$CANDIDATE_SOURCE"
          else
            python3 .github/scripts/collect-suite-release.py "$RUNNER_TEMP/suite-archives" "$RUNNER_TEMP/suite-assets" "$RELEASE_TAG"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-release-assets
          path: ${{ runner.temp }}/suite-assets/*
          retention-days: 7
          if-no-files-found: error
      - name: Complete existing published release
        if: inputs.publish_existing && inputs.candidate-source == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/publish-missing-suite-assets.py "$RUNNER_TEMP/suite-assets" "$RELEASE_TAG"
