name: Verify public installer migration

# Verify the documented one-time public installer path independently of the
# historical automatic updater. This does not rerun the four fresh-install jobs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published destination tag; this migration verifies v3.1.2.
        required: true
        type: string
        default: v3.1.2
      source:
        description: Full original payload commit recorded by the public v3.1.2 readers.
        required: true
        type: string
      tooling-sha:
        description: Full commit containing the current installer migration acceptance tooling.
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer-migration:
    name: Public v3.1.1 installer migration (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout current migration acceptance tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
      - name: Verify immutable migration inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          TOOLING_SHA: ${{ inputs.tooling-sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = v3.1.2
          [[ "$RELEASE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          test -f scripts/accept-published-suite.mjs
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Migrate the old installation with the actual public installer
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/accept-published-suite.mjs "$RELEASE_TAG" "$RELEASE_SOURCE" "$RELEASE_TARGET" installer-migrate-v3.1.1
      - name: Preserve the bounded public installer migration result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-installer-migration-v3.1.1-${{ matrix.target }}
          path: ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
          if-no-files-found: warn
          retention-days: 7
