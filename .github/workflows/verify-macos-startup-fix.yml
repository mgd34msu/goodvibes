name: Verify macOS startup fix

# Focused native verification independent of full CI. The two old shared support
# archives do not establish a complete new release; this workflow cannot publish.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full application commit to build and install on the original Mac account.
        required: true
        type: string
        default: 0bae26c79271a54b25fdf9fb220318dc7988ab4d
      tooling-sha:
        description: Full commit containing the focused verification script.
        required: true
        type: string
      support-artifact-run-id:
        description: Existing staged artifact supplying only unchanged browser-driver and WebUI archives.
        required: true
        type: string
        default: '42941236483'
      tag:
        description: Application version label; no tag is created or required.
        required: true
        type: string
        default: v3.1.2

permissions:
  contents: read
  actions: read

jobs:
  macos-startup:
    name: Focused native startup verification (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout current verification tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
      - name: Verify immutable inputs and retain the verification closure
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          SOURCE_SHA: ${{ inputs.source }}
          SUPPORT_RUN_ID: ${{ inputs.support-artifact-run-id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SUPPORT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          mkdir -p "$RUNNER_TEMP/verification-tooling/scripts" "$RUNNER_TEMP/verification-tooling/products/daemon/scripts"
          cp scripts/verify-macos-startup-fix.mjs scripts/accept-published-suite.mjs scripts/diagnose-macos-native.mjs "$RUNNER_TEMP/verification-tooling/scripts/"
          cp products/daemon/scripts/native-execution-process.mjs "$RUNNER_TEMP/verification-tooling/products/daemon/scripts/"
      - name: Checkout the application source to verify
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source }}
      - name: Verify original application source and version
        env:
          SOURCE_SHA: ${{ inputs.source }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA:scripts/install.sh"
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Setup pinned Bun and source dependencies
        uses: ./.github/actions/setup
        with:
          bun-version: '1.3.14'
      - name: Check the application version label
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" bun packages/engine/scripts/verify-release-tag-version.ts
      - name: Build the application engine
        run: bun packages/engine/scripts/build.ts
      - name: Package all three current native Mac products and SQLite companions
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun .github/scripts/package-suite-release.mjs "$RELEASE_TARGET" "$RUNNER_TEMP/current-mac-assets" "$RELEASE_TAG" --native-members-only
      - name: Download original shared support archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staged-release-assets
          path: ${{ runner.temp }}/support-assets
          run-id: ${{ inputs.support-artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify real install, launchd startup stability, restart and cleanup
        env:
          SOURCE_SHA: ${{ inputs.source }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
          GOODVIBES_ACCEPTANCE_DIAGNOSTICS: '1'
        run: node "$RUNNER_TEMP/verification-tooling/scripts/verify-macos-startup-fix.mjs" "$SOURCE_SHA" "$RELEASE_TAG" "$RELEASE_TARGET" "$RUNNER_TEMP/current-mac-assets" "$RUNNER_TEMP/support-assets"
      - name: Preserve bounded focused verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-macos-startup-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
            ${{ runner.temp }}/goodvibes-published-*/native-diagnostics.json
            ${{ runner.temp }}/macos-startup-fix-result.json
          if-no-files-found: warn
          retention-days: 7
