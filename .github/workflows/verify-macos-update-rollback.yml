name: Verify macOS unattended update and rollback

# Private native lifecycle fixtures, not a release. Both versions are compiled
# honestly in disposable copies; the tracked application version stays 3.1.2.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full application commit whose actual Mac updater and rollback are being verified.
        required: true
        type: string
      tooling-sha:
        description: Full commit containing the private fixture producer and native lifecycle verifier.
        required: true
        type: string
      support-artifact-run-id:
        description: Existing staged artifact supplying the unchanged versionless browser driver only.
        required: true
        type: string
        default: '42941236483'

permissions:
  contents: read
  actions: read

jobs:
  macos-update-rollback:
    name: Actual unattended update and complete rollback (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Checkout immutable fixture and verification tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tooling-sha }}
      - name: Verify immutable inputs and retain the lifecycle tooling
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          SOURCE_SHA: ${{ inputs.source }}
          SUPPORT_RUN_ID: ${{ inputs.support-artifact-run-id }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SUPPORT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$SUPPORT_RUN_ID" = '42941236483'
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          mkdir -p "$RUNNER_TEMP/update-verification-tooling/scripts" "$RUNNER_TEMP/update-verification-tooling/products/daemon/scripts"
          cp scripts/build-macos-update-fixtures.mjs scripts/verify-macos-update-rollback.mjs scripts/accept-published-suite.mjs scripts/accept-staged-suite.mjs scripts/diagnose-macos-native.mjs "$RUNNER_TEMP/update-verification-tooling/scripts/"
          cp products/daemon/scripts/native-execution-process.mjs "$RUNNER_TEMP/update-verification-tooling/products/daemon/scripts/"
      - name: Checkout the application source to verify
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - name: Verify the original application source
        env:
          SOURCE_SHA: ${{ inputs.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA:scripts/install.sh"
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Setup pinned Bun and source dependencies
        uses: ./.github/actions/setup
        with:
          bun-version: '1.3.14'
      - name: Download original versionless browser support
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staged-release-assets
          path: ${{ runner.temp }}/support-assets
          run-id: ${{ inputs.support-artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Provide GNU tar for the existing deterministic WebUI packer
        run: |
          if ! brew list --versions gnu-tar >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install gnu-tar
          fi
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build actual 3.1.2 and 3.1.3 native and WebUI fixture cohorts
        env:
          SOURCE_SHA: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: bun "$RUNNER_TEMP/update-verification-tooling/scripts/build-macos-update-fixtures.mjs" "$SOURCE_SHA" "$RELEASE_TARGET" "$RUNNER_TEMP/macos-update-fixtures" "$RUNNER_TEMP/support-assets"
      - name: Observe real launchd automatic delivery and complete-cohort rollback
        env:
          SOURCE_SHA: ${{ inputs.source }}
          RELEASE_TARGET: ${{ matrix.target }}
          GOODVIBES_ACCEPTANCE_DIAGNOSTICS: '1'
        run: node "$RUNNER_TEMP/update-verification-tooling/scripts/verify-macos-update-rollback.mjs" "$SOURCE_SHA" "$RELEASE_TARGET" "$RUNNER_TEMP/macos-update-fixtures"
      - name: Preserve bounded update and rollback receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-macos-update-rollback-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/macos-update-fixtures-result.json
            ${{ runner.temp }}/macos-update-rollback-result.json
            ${{ runner.temp }}/goodvibes-published-*/acceptance-result.json
            ${{ runner.temp }}/goodvibes-published-*/native-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
