name: Voice runtimes

# Build a goodvibes voice engine bundle and publish it to the ONE append-only
# release tag that hosts every voice engine asset: `voice-runtimes-v1`. Each
# asset ships with a `<asset>.sha256` sidecar. Assets are STABLE: never
# re-uploaded in place and never renamed; a new build produces a new versioned
# filename. Upload is therefore non-clobbering: re-running for an already-present
# filename fails loudly rather than silently replacing a pinned asset.
#
# Two ways in, and only the first can publish:
# - By hand, to build a new version. After a successful run, stamp the printed
#   WHISPER_ENGINES entry (url + bytes + sha256) into
#   packages/engine/platform/src/platform/voice/provisioning/manifest.ts in the same PR.
# - On a push to main that changes that manifest, its origins or this file: the
#   linux-x64 bundle it pins is downloaded from every origin the product tries
#   (runtime-origins.ts) and checked against the pinned size and digest.
#   Nothing is built or published.
#   A rebuild is not compared with the pin: the bundle's bytes depend on the
#   compiler that built it, so a rebuild on a newer runner image has another
#   digest and can never match. The run fails when no origin serves the pinned
#   bytes, or when an origin serves other bytes under the pinned name; an origin
#   that does not have the asset yet is a warning, because provisioning falls
#   back to the next origin.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Which engine bundle to build"
        required: true
        default: "whisper"
        type: choice
        options:
          - whisper
      version:
        description: "Engine version (whisper.cpp source tag, no leading v)"
        required: false
        default: "1.8.2"
      source_sha256:
        description: "sha256 of the source archive, for a version the build script has no pin for (verify it against upstream first)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - packages/engine/platform/src/platform/voice/provisioning/manifest.ts
      - packages/engine/platform/src/platform/voice/provisioning/runtime-origins.ts
      - .github/workflows/voice-runtimes.yml

concurrency:
  # Never let two publish runs race the same append-only tag.
  group: voice-runtimes
  cancel-in-progress: false

env:
  VOICE_RUNTIMES_TAG: voice-runtimes-v1

jobs:
  # A push: the pinned bundle must be downloadable, with the pinned bytes.
  verify-pinned:
    name: Pinned bundle is published (linux-x64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The manifest imports only types beside its origins, so Bun alone reads it.
      - name: Setup Bun
        uses: ./.github/actions/bun
      - name: Download the pinned bundle from every origin and compare it with the pin
        run: |
          pinned=$(bun -e '
            const { WHISPER_ENGINES } = await import("./packages/engine/platform/src/platform/voice/provisioning/manifest.ts");
            const engine = WHISPER_ENGINES["linux-x64"];
            if (!engine?.bundle.url) throw new Error("The manifest pins no linux-x64 whisper engine.");
            const { url, fallbackUrls = [], bytes, sha256 } = engine.bundle;
            console.log([bytes, sha256, url, ...fallbackUrls].join("\n"));
          ')
          { read -r bytes; read -r sha256; mapfile -t urls; } <<< "$pinned"
          dir="$RUNNER_TEMP/pinned-voice-bundle"; mkdir -p "$dir"
          served=0; i=0
          for url in "${urls[@]}"; do
            i=$((i + 1)); file="$dir/$i.tar.gz"
            status=$(curl -sSL --retry 3 --retry-all-errors --max-time 120 -o "$file" -w '%{http_code}' "$url") || status=error
            if [ "$status" = 404 ]; then
              echo "::warning title=Voice runtime origin::$url is not published; provisioning falls back to the next origin. To publish it there, upload the pinned bytes, verified against sha256:$sha256, to that release."
              continue
            fi
            if [ "$status" != 200 ]; then
              echo "::error::$url could not be read (HTTP $status)."
              exit 1
            fi
            got_bytes=$(stat -c %s "$file"); got_sha=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$got_bytes" != "$bytes" ] || [ "$got_sha" != "$sha256" ]; then
              echo "::error::$url serves $got_bytes bytes with sha256:$got_sha, but the manifest pins $bytes bytes with sha256:$sha256."
              exit 1
            fi
            echo "$url serves the pinned $bytes bytes, sha256:$sha256."
            served=$((served + 1))
          done
          if [ "$served" = 0 ]; then
            echo "::error::No origin serves the pinned bundle (sha256:$sha256). Run this workflow by hand to build and publish a bundle, then pin the url, bytes and sha256 it prints in manifest.ts."
            exit 1
          fi

  # By hand: build a new bundle, publish it once, and print what to pin.
  build-and-publish:
    name: Build + publish (linux-x64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Needed to create the release (if absent) and upload assets to the tag.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Install build toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: cmake build-essential
      - name: Build the bundle
        env:
          BUNDLE_VERSION: ${{ github.event.inputs.version || '1.8.2' }}
          SOURCE_SHA256: ${{ github.event.inputs.source_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          bun packages/engine/scripts/build-whisper-bundle.ts \
            --version "$BUNDLE_VERSION" \
            --out .tmp/voice-runtimes \
            --tag "$VOICE_RUNTIMES_TAG" \
            --repo "$REPO" \
            ${SOURCE_SHA256:+--source-sha256 "$SOURCE_SHA256"}
      # The archive is byte-stable for the same compiled program, but the program's
      # bytes follow the compiler, so a rebuild of a pinned version on another
      # runner image differs from the pin.
      - name: Refuse other bytes under a name the manifest pins
        env:
          BUNDLE_VERSION: ${{ github.event.inputs.version || '1.8.2' }}
        run: |
          name="goodvibes-whisper-cpp-${BUNDLE_VERSION}-linux-x64.tar.gz"
          built=$(sha256sum ".tmp/voice-runtimes/$name" | cut -d' ' -f1)
          pinned=$(bun -e '
            const { WHISPER_ENGINES } = await import("./packages/engine/platform/src/platform/voice/provisioning/manifest.ts");
            const bundle = WHISPER_ENGINES["linux-x64"]?.bundle;
            console.log(bundle?.url?.endsWith("/" + process.argv.at(-1)) ? bundle.sha256 : "");
          ' "$name")
          if [ -n "$pinned" ] && [ "$pinned" != "$built" ]; then
            echo "::error::The manifest already pins $name as sha256:$pinned, and this build is sha256:$built. Publishing it would put two different files under one pinned name, so nothing was published."
            exit 1
          fi
      - name: Ensure the append-only release tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$VOICE_RUNTIMES_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$VOICE_RUNTIMES_TAG" \
              --repo "$REPO" \
              --title "Voice runtimes (append-only)" \
              --latest=false \
              --notes "Append-only host for goodvibes voice engine bundles. Assets are never re-uploaded in place or renamed; each carries a .sha256 sidecar." \
              || gh release view "$VOICE_RUNTIMES_TAG" --repo "$REPO" >/dev/null  # another version's run may have created it first
          fi
      - name: Upload bundle + sidecar (append-only, fails if the asset already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_VERSION: ${{ github.event.inputs.version || '1.8.2' }}
          REPO: ${{ github.repository }}
        run: |
          # No --clobber: a pinned asset is never replaced. Each file is uploaded on its
          # own so a rerun after a half-finished upload adds only what is missing, and
          # refuses an existing file whose bytes differ from the build.
          release_url="repos/$REPO/releases/tags/$VOICE_RUNTIMES_TAG"
          for file in \
            ".tmp/voice-runtimes/goodvibes-whisper-cpp-${BUNDLE_VERSION}-linux-x64.tar.gz" \
            ".tmp/voice-runtimes/goodvibes-whisper-cpp-${BUNDLE_VERSION}-linux-x64.tar.gz.sha256"; do
            name=$(basename "$file")
            remote=$(gh api "$release_url" --jq ".assets[] | select(.name == \"$name\") | .digest")
            if [ -z "$remote" ]; then
              gh release upload "$VOICE_RUNTIMES_TAG" "$file" --repo "$REPO"
            elif [ "$remote" = "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]; then
              echo "$name is already published with identical bytes"
            else
              echo "::error::$name is already published with different bytes; voice runtime assets are append-only. Publish a new version instead."
              exit 1
            fi
          done
