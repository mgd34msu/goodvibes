name: Voice runtimes

# Build a goodvibes voice engine bundle reproducibly and publish it to the ONE
# append-only release tag that hosts every voice engine asset: `voice-runtimes-v1`.
# Each asset ships with a `<asset>.sha256` sidecar. Assets are STABLE: never
# re-uploaded in place and never renamed; a new build produces a new versioned
# filename. Upload is therefore non-clobbering: re-running for an already-present
# filename fails loudly rather than silently replacing a pinned asset.
#
# Two ways in:
# - By hand, to build a new version. After a successful run, stamp the printed
#   WHISPER_ENGINES entry (url + bytes + sha256) into
#   packages/engine/platform/src/platform/voice/provisioning/manifest.ts in the same PR.
# - On a push to main that changes that manifest: the linux-x64 bundle it pins
#   must be published with exactly the pinned digest. When it already is, the run
#   ends there; when it is missing, it is built, and published only if the build
#   has the pinned digest. A published asset with other bytes fails the run.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Which engine bundle to build"
        required: true
        default: "whisper"
        type: choice
        options:
          - whisper
      version:
        description: "Engine version (whisper.cpp source tag, no leading v)"
        required: false
        default: "1.8.2"
      source_sha256:
        description: "sha256 of the source archive, for a version the build script has no pin for (verify it against upstream first)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - packages/engine/platform/src/platform/voice/provisioning/manifest.ts

concurrency:
  # Never let two publish runs race the same append-only tag.
  group: voice-runtimes
  cancel-in-progress: false

env:
  VOICE_RUNTIMES_TAG: voice-runtimes-v1

jobs:
  build-and-publish:
    name: Build + publish (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Needed to create the release (if absent) and upload assets to the tag.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Choose the bundle (the input, or what the manifest pins)
        id: bundle
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "version=${INPUT_VERSION:-1.8.2}" >> "$GITHUB_OUTPUT"
            echo "pinned-sha256=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun -e '
            const { WHISPER_ENGINES } = await import("./packages/engine/platform/src/platform/voice/provisioning/manifest.ts");
            const engine = WHISPER_ENGINES["linux-x64"];
            if (!engine) throw new Error("The manifest pins no linux-x64 whisper engine.");
            console.log(`version=${engine.version}`);
            console.log(`pinned-sha256=${engine.bundle.sha256}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Check whether the pinned bundle is already published
        id: published
        if: steps.bundle.outputs.pinned-sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUNDLE_VERSION: ${{ steps.bundle.outputs.version }}
          PINNED_SHA256: ${{ steps.bundle.outputs.pinned-sha256 }}
        run: |
          name="goodvibes-whisper-cpp-${BUNDLE_VERSION}-linux-x64.tar.gz"
          remote=""
          if gh release view "$VOICE_RUNTIMES_TAG" --repo "$REPO" >/dev/null 2>&1; then
            remote=$(gh api "repos/$REPO/releases/tags/$VOICE_RUNTIMES_TAG" --jq ".assets[] | select(.name == \"$name\") | .digest")
          fi
          if [ -z "$remote" ]; then
            echo "$name is not published yet; building it."
            echo "done=false" >> "$GITHUB_OUTPUT"
          elif [ "$remote" = "sha256:$PINNED_SHA256" ]; then
            echo "$name is published with the pinned digest."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$name is published as $remote, but the manifest pins sha256:$PINNED_SHA256."
            exit 1
          fi
      - name: Install build toolchain
        if: steps.published.outputs.done != 'true'
        uses: ./.github/actions/apt-install
        with:
          packages: cmake build-essential
      - name: Build the reproducible bundle
        if: steps.published.outputs.done != 'true'
        env:
          BUNDLE_VERSION: ${{ steps.bundle.outputs.version }}
          SOURCE_SHA256: ${{ github.event.inputs.source_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          bun packages/engine/scripts/build-whisper-bundle.ts \
            --version "$BUNDLE_VERSION" \
            --out .tmp/voice-runtimes \
            --tag "$VOICE_RUNTIMES_TAG" \
            --repo "$REPO" \
            ${SOURCE_SHA256:+--source-sha256 "$SOURCE_SHA256"}
      - name: The build has the pinned digest
        if: steps.published.outputs.done == 'false'
        env:
          BUNDLE_VERSION: ${{ steps.bundle.outputs.version }}
          PINNED_SHA256: ${{ steps.bundle.outputs.pinned-sha256 }}
        run: |
          built=$(sha256sum ".tmp/voice-runtimes/goodvibes-whisper-cpp-${BUNDLE_VERSION}-linux-x64.tar.gz" | cut -d' ' -f1)
          if [ "$built" != "$PINNED_SHA256" ]; then
            echo "::error::The build is sha256:$built, but the manifest pins sha256:$PINNED_SHA256. Nothing was published."
            exit 1
          fi
      - name: Ensure the append-only release tag exists
        if: steps.published.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$VOICE_RUNTIMES_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$VOICE_RUNTIMES_TAG" \
              --repo "$REPO" \
              --title "Voice runtimes (append-only)" \
              --latest=false \
              --notes "Append-only host for goodvibes voice engine bundles. Assets are never re-uploaded in place or renamed; each carries a .sha256 sidecar." \
              || gh release view "$VOICE_RUNTIMES_TAG" --repo "$REPO" >/dev/null  # another version's run may have created it first
          fi
      - name: Upload bundle + sidecar (append-only, fails if the asset already exists)
        if: steps.published.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_VERSION: ${{ steps.bundle.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # No --clobber: a pinned asset is never replaced. Each file is uploaded on its
          # own so a rerun after a half-finished upload adds only what is missing, and
          # refuses an existing file whose bytes differ from the build.
          release_url="repos/$REPO/releases/tags/$VOICE_RUNTIMES_TAG"
          for file in \
            ".tmp/voice-runtimes/goodvibes-whisper-cpp-${BUNDLE_VERSION}-linux-x64.tar.gz" \
            ".tmp/voice-runtimes/goodvibes-whisper-cpp-${BUNDLE_VERSION}-linux-x64.tar.gz.sha256"; do
            name=$(basename "$file")
            remote=$(gh api "$release_url" --jq ".assets[] | select(.name == \"$name\") | .digest")
            if [ -z "$remote" ]; then
              gh release upload "$VOICE_RUNTIMES_TAG" "$file" --repo "$REPO"
            elif [ "$remote" = "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]; then
              echo "$name is already published with identical bytes"
            else
              echo "::error::$name is already published with different bytes; voice runtime assets are append-only. Publish a new version instead."
              exit 1
            fi
          done
