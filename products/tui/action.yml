name: 'Run GoodVibes'
description: 'Install a pinned, checksum-verified GoodVibes release and run a non-interactive command or prompt against a workspace in CI.'
branding:
  icon: 'terminal'
  color: 'purple'

inputs:
  version:
    description: 'GoodVibes suite release to install: a published tag like v3.1.2, or "latest".'
    required: false
    default: 'latest'
  prompt:
    description: 'Non-interactive prompt to run (goodvibes run <prompt>). Requires a provider credential (e.g. OPENAI_API_KEY) in the job env.'
    required: false
    default: ''
  command:
    description: 'A goodvibes subcommand to run instead of a prompt (e.g. "doctor", "status", "doctor explain"), split into words as a shell would: quote a word that holds spaces with single or double quotes. Nothing is expanded (no variables, globs or backslash escapes). Ignored when prompt is set.'
    required: false
    default: ''
  args:
    description: 'Extra arguments appended after the command or prompt, split into words as a shell would: quote an argument that holds spaces with single or double quotes. Nothing is expanded (no variables, globs or backslash escapes).'
    required: false
    default: ''
  output:
    description: 'Output format for run: text | json | stream-json.'
    required: false
    default: 'text'
  timeout:
    description: 'Cancel a prompt run that takes longer than this (goodvibes run --timeout): a bare number is seconds, or use an ms, s, m or h suffix. The run then exits 124 with stopReason timeout. Empty removes the limit.'
    required: false
    default: '30m'
  max-turns:
    description: 'Stop a prompt run after this many model answers that still ask for tools (goodvibes run --max-turns). The run then exits 1 with stopReason max_turns. Empty removes the limit.'
    required: false
    default: '50'
  working-directory:
    description: 'Workspace directory to run in.'
    required: false
    default: '.'
  install-dir:
    description: 'Directory to install the binaries into.'
    required: false
    default: ''
  install-agent:
    description: 'Also install the same release’s compiled goodvibes-agent (1) or skip it (0). Off by default in CI.'
    required: false
    default: '0'

outputs:
  version:
    description: 'The goodvibes --version string of the installed binary.'
    value: ${{ steps.install.outputs.version }}
  result-file:
    description: 'Path of a file under RUNNER_TEMP holding everything the prompt or command printed to stdout (for output json, the result object; for stream-json, one frame per line). Empty when nothing was run.'
    value: ${{ steps.run.outputs.result-file }}
  exit-code:
    description: 'Exit code of the prompt or command (0 completed, 1 failed or max-turns reached, 2 invalid input, 3 outcome unknown, 124 timeout, 130 cancelled). Empty when nothing was run.'
    value: ${{ steps.run.outputs.exit-code }}
  stop-reason:
    description: 'stopReason from the result of a prompt run with output json or stream-json (for example completed, max_turns, timeout). Empty for text output or when nothing was run.'
    value: ${{ steps.run.outputs.stop-reason }}

runs:
  using: composite
  steps:
    - name: Install GoodVibes (pinned, checksum-verified)
      id: install
      shell: bash
      env:
        GOODVIBES_VERSION: ${{ inputs.version }}
        GOODVIBES_REQUESTED_INSTALL_DIR: ${{ inputs.install-dir }}
        GOODVIBES_AGENT: ${{ inputs.install-agent }}
        ACTION_PATH: ${{ github.action_path }}
        # CI installs binaries only — never register a persistent user service.
        GOODVIBES_DAEMON_SERVICE: '0'
      run: |
        set -eu
        # Resolve the install directory (default to a stable, PATH-able dir).
        INSTALL_DIR="$GOODVIBES_REQUESTED_INSTALL_DIR"
        if [ -z "$INSTALL_DIR" ]; then
          INSTALL_DIR="$HOME/.goodvibes-bin"
        fi
        mkdir -p "$INSTALL_DIR"
        export GOODVIBES_INSTALL_DIR="$INSTALL_DIR"
        # Run the release installer from the same checkout as this action, so
        # the script is exactly the one at the ref the workflow pinned, not
        # whatever a mutable URL serves today. It selects one release for all
        # enabled products and verifies the compiled programs, runtime
        # companions and WebUI against that release's SHA256SUMS.txt. No
        # checkout build or system Bun is required.
        INSTALLER="$ACTION_PATH/../../scripts/install.sh"
        if [ ! -f "$INSTALLER" ]; then
          echo "GoodVibes installer not found at $INSTALLER; use this action from the repository checkout at a pinned ref." >&2
          exit 1
        fi
        sh "$INSTALLER"
        # Put the install dir on PATH for later steps in the job.
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        VERSION_STRING="$("$INSTALL_DIR/goodvibes" --version)"
        echo "version=$VERSION_STRING" >> "$GITHUB_OUTPUT"
        echo "Installed: $VERSION_STRING"

    - name: Run GoodVibes
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GV_PROMPT: ${{ inputs.prompt }}
        GV_COMMAND: ${{ inputs.command }}
        GV_ARGS: ${{ inputs.args }}
        GV_OUTPUT: ${{ inputs.output }}
        GV_TIMEOUT: ${{ inputs.timeout }}
        GV_MAX_TURNS: ${{ inputs.max-turns }}
      run: |
        set -eu
        goodvibes --version
        RESULT_FILE="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/goodvibes-result-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$$.out"
        # command and args are split into words as a shell splits them: spaces, tabs and
        # new lines separate words; single or double quotes keep a phrase (spaces included)
        # in one word. Nothing is expanded: no variables, globs or backslash escapes.
        # prompt, output, timeout and max-turns are each passed as one argument.
        GV_ARGV=()
        add_words() {
          local text="$1" word="" quote="" in_word=0 char i
          for (( i = 0; i < ${#text}; i++ )); do
            char="${text:i:1}"
            if [ -n "$quote" ]; then
              if [ "$char" = "$quote" ]; then quote=""; else word+="$char"; fi
            elif [ "$char" = "'" ] || [ "$char" = '"' ]; then
              quote="$char"; in_word=1
            elif [[ "$char" =~ [[:space:]] ]]; then
              if [ "$in_word" = 1 ]; then GV_ARGV+=("$word"); word=""; in_word=0; fi
            else
              word+="$char"; in_word=1
            fi
          done
          if [ -n "$quote" ]; then
            echo "The action's input has a $quote quote that is never closed: $text" >&2
            exit 2
          fi
          if [ "$in_word" = 1 ]; then GV_ARGV+=("$word"); fi
        }
        if [ -n "$GV_PROMPT" ]; then
          GV_ARGV=(--non-interactive --output "$GV_OUTPUT" run)
          if [ -n "$GV_TIMEOUT" ]; then GV_ARGV+=(--timeout "$GV_TIMEOUT"); fi
          if [ -n "$GV_MAX_TURNS" ]; then GV_ARGV+=(--max-turns "$GV_MAX_TURNS"); fi
          GV_ARGV+=("$GV_PROMPT")
          echo "Running non-interactive prompt (timeout: ${GV_TIMEOUT:-none}, max turns: ${GV_MAX_TURNS:-none})"
        elif [ -n "$GV_COMMAND" ]; then
          GV_ARGV=(--non-interactive)
          add_words "$GV_COMMAND"
        else
          echo "No prompt or command provided; install + version only."
          exit 0
        fi
        add_words "$GV_ARGS"
        if [ -z "$GV_PROMPT" ]; then
          printf 'Running: goodvibes'; printf ' %q' "${GV_ARGV[@]}"; printf '\n'
        fi
        # The result also goes to the step log; the exit code is the run's own.
        set +e
        goodvibes "${GV_ARGV[@]}" | tee "$RESULT_FILE"
        EXIT_CODE="${PIPESTATUS[0]}"
        set -e
        STOP_REASON=""
        if [ -n "$GV_PROMPT" ] && [ "$GV_OUTPUT" != "text" ]; then
          if command -v jq >/dev/null 2>&1; then
            STOP_REASON="$(jq -r 'select(type == "object" and has("stopReason") and ((.type // "TURN_RESULT") | test("^(TURN_RESULT|NATIVE_INTAKE_RESULT)$"))) | .stopReason' "$RESULT_FILE" 2>/dev/null | tail -n 1 || true)"
          else
            STOP_REASON="$(grep -o '"stopReason": *"[^"]*"' "$RESULT_FILE" | tail -n 1 | sed 's/.*: *"\([^"]*\)"/\1/' || true)"
          fi
        fi
        {
          echo "result-file=$RESULT_FILE"
          echo "exit-code=$EXIT_CODE"
          echo "stop-reason=$STOP_REASON"
        } >> "$GITHUB_OUTPUT"
        exit "$EXIT_CODE"
